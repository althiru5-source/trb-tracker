const UP = {u:null, subs:null, files:[], pages:"", pics:false, done:true};
let JOB = null;
const MATOPEN = new Set(), MATALL = new Set();
const CHUNK = 7000, NOTES_PER = 6, MAX_PAGES = 150, CONC = 2;
const isImageFile = f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name);
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name);

function upUnit(){

    const comp = compUnits(), noMat = comp.filter(n=>!M.some(m=>m.u===n));
    UP.u = noMat[0] || comp[0] || (act[0] && act[0].n) || null;
    UP.subs = null;
  }

function parseRange(str, max){
  const s = String(str||"").trim().replace(/\s*(?:[-–—]|to)\s*/gi, "-");
  if(!s) return Array.from({length:max}, (_,i)=>i+1);
  const out = new Set();
  s.split(/[,;\s]+/).forEach(tok=>{
    if(!tok) return;
    const m = tok.match(/^(\d+)(?:-(\d+))?$/);
    if(!m) throw new Error("Write pages as numbers and ranges, for example 1-12, 15.");
    let a = +m[1], b = m[2] ? +m[2] : a; if(a > b) [a, b] = [b, a];
    for(let i = Math.max(1, a); i <= Math.min(max, b); i++) out.add(i);
  });
  return [...out].sort((a,b)=>a-b);
}
function pagesLabel(pgs, word){
  word = word || "page";
  const a = [...new Set(pgs)].sort((x,y)=>x-y); if(!a.length) return "";
  const rs = []; let s = a[0], p = a[0];
  for(let i = 1; i <= a.length; i++){ if(a[i] === p+1){ p = a[i]; continue; } rs.push(s===p ? ""+s : s+"–"+p); s = a[i]; p = a[i]; }
  return (a.length===1 ? word : word+"s")+" "+rs.join(", ");
}
function cutAt(t, n){
  if(t.length <= n) return t.length;
  let i = t.lastIndexOf("\n", n); if(i > n*0.5) return i+1;
  i = t.lastIndexOf(". ", n); if(i > n*0.5) return i+2;
  return n;
}
/* pages: [{pg, text}] → text parts of about CHUNK characters, each starting with a page marker */
function textParts(pages, word){
  const list = []; let cur = null;
  const mark = pg => pg ? "\n["+word+" "+pg+"]\n" : "\n";
  const flush = ()=>{ if(cur && cur.text.trim()) list.push(cur); cur = null; };
  pages.forEach(p=>{
    let t = String(p.text||"").trim(), cont = false;
    while(t.length){
      if(!cur) cur = {kind:"text", text:"", pgs:[]};
      const head = cont && p.pg ? "\n["+word+" "+p.pg+", continued]\n" : mark(p.pg);
      const room = CHUNK - cur.text.length - head.length;
      if(t.length <= room){ cur.text += head + t; if(p.pg) cur.pgs.push(p.pg); t = ""; }
      else if(cur.text.length > CHUNK*0.4){ flush(); }
      else { const cut = cutAt(t, Math.max(room, 800)); cur.text += head + t.slice(0, cut); if(p.pg) cur.pgs.push(p.pg); t = t.slice(cut).trim(); cont = true; flush(); }
    }
  });
  flush();
  list.forEach((c,i)=>{ c.label = c.pgs.length ? pagesLabel(c.pgs, word.toLowerCase()) : "part "+(i+1)+" of "+list.length; });
  return list;
}
function pageText(items){
  let out = "", prev = null;
  for(const it of items){
    if(typeof it.str !== "string") continue;
    if(!it.str){ if(it.hasEOL && !/\n$/.test(out)) out += "\n"; if(it.hasEOL) prev = it; continue; }
    if(prev && !prev.hasEOL && it.transform && prev.transform){
      const size = Math.abs(prev.transform[3]) || 10;
      if(Math.abs(it.transform[5] - prev.transform[5]) > Math.max(2, size*0.5)) out += "\n";
      else { const gap = it.transform[4] - (prev.transform[4] + (prev.width || 0)); if(gap > size*0.15 && !/\s$/.test(out) && !/^\s/.test(it.str)) out += " "; }
    }
    out += it.str; if(it.hasEOL) out += "\n";
    prev = it;
  }
  return out.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function renderPdfPages(doc, pgs){
  const out = [];
  for(const pg of pgs){
    const page = await doc.getPage(pg);
    const vp1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(2.5, 1100 / vp1.width)});
    const c = document.createElement("canvas"); c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    const b = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.85));
    c.width = c.height = 0; page.cleanup();
    if(!b) throw new Error("Page "+pg+" could not be turned into a picture.");
    out.push(b);
  }
  return out;
}
async function toSendable(file){
  const types = (IMGLIM && IMGLIM.mediaTypes) || [];
  if(types.includes(file.type) && file.size <= ((IMGLIM && IMGLIM.maxInputBytes) || 20e6)) return file;
  let bmp; try{ bmp = await createImageBitmap(file); }catch(e){ throw new Error("“"+file.name+"” could not be opened as a picture."); }
  const sc = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const b = await new Promise(r=>c.toBlob(r, "image/jpeg", 0.88)); c.width = c.height = 0;
  if(!b) throw new Error("“"+file.name+"” could not be converted.");
  return b;
}
const imgPer = () => Math.max(1, Math.min(2, (IMGLIM && IMGLIM.maxCount) || 1));
function pdfImgPart(doc, pgs){ return {kind:"img", pgs, label:pagesLabel(pgs), desc:"pictures of PDF pages "+pgs.join(", ")+", in that order", getImages:()=>renderPdfPages(doc, pgs)}; }
function photoPart(files, idx){ return {kind:"img", files, pgs:idx, label:pagesLabel(idx, "photo"), desc:"photos of the material taken by the student; use the photo number ("+idx.join(", ")+", in that order) as the page number", getImages:()=>Promise.all(files.map(toSendable))}; }

async function pdfParts(file, job){
  const lib = await getPdfjs();
  let doc;
  try{ doc = await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise; }
  catch(e){ throw new Error(e && e.name === "PasswordException" ? "This PDF is password-protected. Save an unlocked copy and upload that." : "This PDF could not be opened."); }
  job.doc = doc;
  const want = parseRange(job.pages, doc.numPages);
  if(!want.length) throw new Error("No pages match “"+job.pages+"”. This PDF has "+doc.numPages+" pages.");
  if(want.length > MAX_PAGES) throw new Error("This PDF has "+want.length+" pages. Read at most "+MAX_PAGES+" at a time by filling in the Pages box, for example 1-"+MAX_PAGES+".");
  const pages = [];
  for(const pg of want){
    job.phase = "Opening page "+pg+" of "+doc.numPages+"…"; if(pg % 10 === 1) renderJob();
    const page = await doc.getPage(pg);
    const text = pageText((await page.getTextContent()).items);
    page.cleanup();
    pages.push({pg, text, chars:text.replace(/\s/g,"").length});
  }
  job.phase = "";
  const pics = !!IMGLIM && (job.pics || false);
  const asPic = p => !!IMGLIM && (pics || p.chars < 120);
  const textPages = pages.filter(p=>!asPic(p) && p.chars > 0), picPages = pages.filter(asPic);
  if(!textPages.length && !picPages.length) throw new Error(IMGLIM ? "No readable pages were found in this PDF." : "This PDF looks scanned, and pictures can’t be sent to Claude in this view.");
  const list = textParts(textPages, "Page");
  for(let i = 0; i < picPages.length; i += imgPer()) list.push(pdfImgPart(doc, picPages.slice(i, i+imgPer()).map(p=>p.pg)));
  list.sort((a,b)=>(a.pgs[0]||0)-(b.pgs[0]||0));
  return {list, how: !picPages.length ? "read as text" : !textPages.length ? "read as pictures" : "read as text and pictures", pages:pagesLabel(want), pw:"p."};
}
const W_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main", MATH_NS = "http://schemas.openxmlformats.org/officeDocument/2006/math", A_NS = "http://schemas.openxmlformats.org/drawingml/2006/main";
function walkDocx(node, out){
  for(let c = node.firstChild; c; c = c.nextSibling){
    if(c.nodeType !== 1) continue;
    const ln = c.localName, ns = c.namespaceURI;
    if(ln === "Fallback") continue;
    if((ns === W_NS || ns === MATH_NS) && ln === "t"){ out.push(c.textContent); continue; }
    if(ns === W_NS && ln === "tab"){ out.push("\t"); continue; }
    if(ns === W_NS && (ln === "br" || ln === "cr")){ out.push("\n"); continue; }
    if(ns === W_NS && (ln === "instrText" || ln === "delText")) continue;
    walkDocx(c, out);
    if(ns === W_NS && ln === "p") out.push("\n");
    if(ns === MATH_NS && ln === "oMath") out.push(" ");
  }
}
async function docxParts(file){
  const zip = await zipOpen(file), f = zip.file("word/document.xml");
  if(!f) throw new Error("This Word file has no readable text.");
  const xml = new DOMParser().parseFromString(await f.async("string"), "application/xml");
  const out = []; walkDocx(xml.documentElement, out);
  const text = out.join("").replace(/\n{3,}/g, "\n\n").trim();
  if(!text) throw new Error("No text was found in this Word file. If it holds pictures of pages, upload them as photos or a PDF.");
  return {list:textParts([{pg:null, text}], "Page"), how:"read as text", pages:"", pw:""};
}
async function pptxParts(file){
  const zip = await zipOpen(file);
  const names = Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/(\d+)\.xml$/)[1] - +b.match(/(\d+)\.xml$/)[1]);
  const pages = [];
  for(const n of names){

function absorb(text, mat){
  const seen = new Set(BANK.map(q=>normQ(q.q)).concat(mat.qs.map(q=>normQ(q.q))));
  let n = 0;
  String(text||"").split(/\r?\n/).forEach(line=>{
    const t = line.trim().replace(/^[\[,\s]+/, "").replace(/[\],\s]+$/, "");
    if(!t || t[0] !== "{") return;
    let x; try{ x = JSON.parse(t); }catch(e){ return; }
    const c = cleanOpts(x); if(!c) return;
    const k = normQ(c.q); if(seen.has(k)) return; seen.add(k);
    const hit = JOB.codes.find(z=>z.c === String(x.s||"").trim()) || JOB.codes[0];
    const q = Object.assign({id:mat.id+"-"+rid(), u:mat.u, s:hit.id}, c, {m:mat.id, kind:x.kind === "mcq" ? "mcq" : "notes"});
    const pg = Number(x.pg); if(Number.isInteger(pg) && pg > 0 && pg < 10000) q.pg = pg;
    if(x.mk !== undefined && x.mk !== null){ const mk = Number(x.mk); if(Number.isInteger(mk) && mk >= 0 && mk < 4 && mk !== c.a) q.mk = mk; }
    mat.qs.push(q); n++;
  });
  return n;
}

async function processPart(part, mat){
  part.st = "running"; renderJob();
  const ctl = new AbortController(); JOB.ctls.add(ctl);
  try{
    const opts = {signal:ctl.signal, modelTier:"default", cache:false};
    if(part.kind === "img") opts.images = await part.getImages();
    if(ctl.signal.aborted) throw {code:"cancelled"};
    const res = await SAMPLE(matPrompt(mat, part, part.kind === "text" ? part.text : ""), opts);
    absorb(res.text, mat);
    const halves = res.truncated ? splitPart(part) : null;
    if(halves){ part.st = "split"; JOB.parts.push(...halves); }
    else part.st = "done";
  }catch(e){
    if(e && e.text) absorb(e.text, mat);
    part.st = "failed";
    const code = e && e.code;
    if(FATAL[code]){ JOB.fatal = FATAL[code]; stopAll(); }
    else if(code !== "cancelled"){ part.err = code || (e && e.message) || "Could not read"; }
  }finally{ JOB.ctls.delete(ctl); }
  rebuildBank(); saveMat(mat); renderJob();
}
function stopAll(){ JOB.cancelled = true; JOB.ctls.forEach(c=>c.abort()); }
async function runGroup(g){
  const job = JOB;
  const mat = {id:"m"+rid(), name:g.name, u:job.u, subs:job.subs, at:Date.now(), pages:"", status:"working", note:"", how:"", pw:"", qs:[]};
  job.mat = mat; job.parts = []; job.phase = "Opening the file…";
  M.push(mat); rebuildBank(); renderJob();
  let prep;
  try{ prep = await prepareParts(g, job); }
  catch(e){
    M = M.filter(x=>x!==mat); rebuildBank();
    job.results.push({name:g.name, error:(e && e.message) || "This file could not be opened."});
    job.mat = null; if(job.doc){ try{ job.doc.destroy(); }catch(_){} job.doc = null; }
    return;
  }
  Object.assign(mat, {how:prep.how, pages:prep.pages, pw:prep.pw});
  job.parts = prep.list; job.phase = "";
  saveMat(mat); renderJob();
  let nextI = 0;
  const worker = async ()=>{ while(!job.cancelled && nextI < job.parts.length){ const p = job.parts[nextI++]; await processPart(p, mat); } };
  await Promise.all(Array.from({length:CONC}, worker));

  mat.status = left.length ? (mat.qs.length ? "partial" : "failed") : "done";
  const word = mat.pw === "slide" ? "slide" : mat.pw === "photo" ? "photo" : "page";
  mat.note = !left.length ? "" : "Not read: "+(left.every(p=>p.pgs && p.pgs.length) ? pagesLabel([].concat(...left.map(p=>p.pgs)), word) : left.map(p=>p.label).join(", "))+".";
  job.results.push({mat});
  job.mat = null;
  if(job.doc){ try{ job.doc.destroy(); }catch(_){} job.doc = null; }

/* A questions file from Claude: {kind:"trb-questions", material:{id,name,u,...}, questions:[...]}.

function importQFile(txt){
  if(GUEST){ toast("Only the tracker’s owner can add questions"); return; }
  let o = null; try{ o = JSON.parse(txt); }catch(e){}
  if(!o || o.kind !== "trb-questions" || !o.material || !Array.isArray(o.questions)){ toast("That isn’t a questions file from Claude."); return; }
  const inc = normMat(Object.assign({}, o.material, {qs:o.questions}));
  if(!inc){ toast("That questions file is damaged. Ask Claude for it again."); return; }
  if(!unitOf(inc.u)){ toast("That file is for a topic this tracker doesn’t have."); return; }
  let m = MBY[inc.id], added = 0;
  if(!m){ M.push(inc); M.sort((a,b)=>a.at-b.at); m = inc; added = inc.qs.length; }
  else {
    const have = new Set(m.qs.map(q=>q.id)), fresh = inc.qs.filter(q=>!have.has(q.id));
    m.qs = m.qs.concat(fresh); added = fresh.length;
    ["name","pages","how","pw","note","status"].forEach(k=>{ if(inc[k]) m[k] = inc[k]; });
    if(inc.subs !== undefined) m.subs = inc.subs;
  }
  rebuildBank(); if(added) saveMat(m); renderAll();
  toast(added ? plural(added, "question")+" added to “"+short(m.name, 40)+"”" : "All of those questions are already here");
}
function onFilePick(fi){

  renderMaterials();

function trendSvg(sessions){
  const pts = sessions.slice(-14), n = pts.length;
  const W = 640, H2 = 230, L = 38, R = 20, T = 20, B = 30;
  const x = i => n===1 ? L+(W-L-R)/2 : L+(W-L-R)*i/(n-1);
  const y = v => T+(H2-T-B)*(1-v/100);
  let g = "";
  [0,25,50,75,100].forEach(v=>{ g += '<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  const path = pts.map((s,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(pct(s.right,s.total)).toFixed(1)).join(" ");
  let dots = "", labels = "";
  pts.forEach((s,i)=>{
    const p = pct(s.right,s.total), tp = "Session "+s.idx+" · "+fmtDate(s.at.t)+" · "+s.right+"/"+s.total+" ("+p+"%)";
    dots += '<circle class="dot" cx="'+x(i).toFixed(1)+'" cy="'+y(p).toFixed(1)+'" r="5"/><circle class="hit" tabindex="0" cx="'+x(i).toFixed(1)+'" cy="'+y(p).toFixed(1)+'" r="16" data-tip="'+esc(tp)+'" aria-label="'+esc(tp)+'"/>';
    if(n<=8 || i%2===(n-1)%2) labels += '<text x="'+x(i).toFixed(1)+'" y="'+(H2-8)+'" text-anchor="middle">S'+s.idx+'</text>';
  });
  const lp = pct(pts[n-1].right, pts[n-1].total);
  const endLbl = '<text class="vl" x="'+x(n-1).toFixed(1)+'" y="'+(y(lp)-12).toFixed(1)+'" text-anchor="'+(n===1?"middle":"end")+'">'+lp+'%</text>';
  return '<svg class="svgc" viewBox="0 0 '+W+' '+H2+'" role="img" aria-label="Score per session, percent correct">'+g+'<path class="ln" d="'+path+'"/>'+dots+endLbl+labels+'</svg>';
}

  tip.textContent = el.getAttribute("data-tip"); tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width/2 - tw/2), window.innerWidth - tw - 8);
  let top = r.top - th - 8; if(top < 8) top = r.bottom + 8;
  tip.style.left = left+"px"; tip.style.top = top+"px";
}
document.addEventListener("pointerover", e=>{ const t = e.target.closest && e.target.closest("[data-tip]"); if(t) showTip(t); else tip.hidden = true; });
document.addEventListener("focusin", e=>{ const t = e.target.closest && e.target.closest("[data-tip]"); if(t) showTip(t); });
document.addEventListener("focusout", ()=>{ tip.hidden = true; });
document.addEventListener("scroll", ()=>{ tip.hidden = true; }, {passive:true});
let toastTimer = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 3600); }
/* Re-rendering replaces inputs; put focus back where it was. */
function keepFocus(fn){
  const a = document.activeElement, id = a && a.id;
  const isText = a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && !/^(checkbox|radio|file)$/.test(a.type)));
  let ss = null; if(isText){ try{ ss = a.selectionStart; }catch(e){} }
  fn();
  if(id && isText){ const b = document.getElementById(id); if(b && b !== a){ b.focus({preventScroll:true}); try{ if(ss !== null) b.setSelectionRange(ss, ss); }catch(e){} } }
}
/* ---------- EVENTS ---------- */
document.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]"); if(tab){ showTab(tab.dataset.tab); return; }
  const go = e.target.closest("[data-go]");
  if(go){ if(go.dataset.order){ P.order = go.dataset.order; P.view = "setup"; } showTab(go.dataset.go); return; }
  const hu = e.target.closest("[data-hu]"); if(hu){ H.pu = +hu.dataset.hu; renderHistory(); return; }
  const hy = e.target.closest("[data-hy]"); if(hy){ H.py = +hy.dataset.hy; renderHistory(); return; }
  const act = e.target.closest("[data-act]");
  if(!act) return;
  const a = act.dataset.act, u = act.dataset.u ? +act.dataset.u : null;
  if(a==="start") startQuiz();
  else if(a==="more") askMore();
  else if(a==="cancelgen"){ if(P.ctl) P.ctl.abort(); }
  else if(a==="pick") pick(+act.dataset.k);
  else if(a==="next") next();
  else if(a==="quit") quit();
  else if(a==="again"){ P.view = "setup"; renderPractice(); window.scrollTo({top:0}); }
  else if(a==="flag"){ flagQ(act.dataset.id); if(TAB==="materials") renderMaterials(); else act.remove(); }
  else if(a==="unflag"){ setFlags(S.flags.slice(), false); renderAll(); toast(GUEST ? "Your flags were restored" : "Flagged questions restored"); }
  else if(a==="copysum"){
    const txt = sessionSummary(P.result);
    const fallback = () => toast("Could not copy. Open History to see this session.");
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Session summary copied"), fallback); }catch(err){ fallback(); }
  }
  else if(a==="copycode"){
    const ta = $("#code"); if(!ta) return;
    ta.value = exportCode();
    const done = () => toast("Progress code copied");
    const fallback = () => { ta.focus(); ta.select(); toast("Select and copy the code shown"); };
    try{ navigator.clipboard.writeText(ta.value).then(done, fallback); }catch(err){ fallback(); }
  }
  else if(a==="import"){
    if(GUEST){ toast("Only the tracker’s owner can import progress"); return; }
    const ta = $("#imp"); if(!ta || !ta.value.trim()){ toast("Paste a progress code first"); return; }
    if(Date.now() - XARM > 4000){ XARM = Date.now(); act.textContent = "This replaces your progress here. Tap again to confirm"; setTimeout(()=>{ if(act.isConnected) act.textContent = "Import and replace my progress"; }, 4000); return; }
    XARM = 0;
    if(GUEST){ toast("Only the tracker’s owner can import progress"); return; }
    try{ importCode(ta.value); DRAFT.imp = ""; P.sel = null; renderAll(); toast("Progress imported"); }catch(err){ toast("That code could not be read. Copy it again in full."); act.textContent = "Import and replace my progress"; }
  }
  /* syllabus editing */
  else if(a==="edsyl"){ ED.on = !ED.on; ARM = null; renderSyllabus(); }
  else if(a==="addsub") addSub(u);
  else if(a==="rmsub") rmSub(u, act.dataset.s);
  else if(a==="rsub"){ const s = unitOf(u) && unitOf(u).subs.find(x=>x.id===act.dataset.s); if(s){ delete s.off; sylChanged(); toast("Restored “"+short(s.name,40)+"”"); } }
  else if(a==="addunit") addUnit();
  else if(a==="rmunit"){ if(armed("rmunit"+u)) rmUnit(u); else arm("rmunit"+u, renderSyllabus); }
  else if(a==="runit"){ const x = unitOf(u); if(x){ delete x.off; sylChanged(); toast("Restored “"+short(x.name,40)+"”"); } }
  else if(a==="upmat"){ if(UP.u !== u){ UP.u = u; UP.subs = null; } showTab("materials"); }
  /* practice scope */
  else if(a==="subs"){ if(P.open.has(u)) P.open.delete(u); else P.open.add(u); renderSetup(); }
  else if(a==="ssall"){ P.sel.set(u, new Set(activeSubs(unitOf(u)).map(s=>s.id))); renderSetup(); }
  else if(a==="ssnone"){ P.sel.set(u, new Set()); renderSetup(); }
  /* materials */
  else if(a==="usall"){ UP.subs = null; renderMaterials(); }
  else if(a==="usnone"){ UP.subs = new Set(); renderMaterials(); }
  else if(a==="rmfile"){ UP.files.splice(+act.dataset.i, 1); renderMaterials(); }
  else if(a==="extract") startExtraction();
  else if(a==="stopjob"){ if(JOB && JOB.running){ stopAll(); renderJob(); } }
  else if(a==="jobdone"){ JOB = null; renderMaterials(); window.scrollTo({top:0}); }
  else if(a==="practjob"){ const j = JOB; JOB = null; practiseMat(j.u, j.subs); }
  else if(a==="practmat"){ const m = MBY[act.dataset.id]; if(m) practiseMat(m.u, m.subs); }
  else if(a==="delmat"){ const id = act.dataset.id; if(armed("del"+id)) deleteMat(id); else arm("del"+id, renderMaterials); }
  else if(a==="mqall"){ MATALL.add(act.dataset.id); renderMaterials(); }
});
document.addEventListener("toggle", e=>{
  const d = e.target; if(!d || !d.dataset) return;
  if(d.classList && d.classList.contains("xfer")){ XOPEN = d.open; return; }
  if(d.dataset.mq){ const id = d.dataset.mq; if(d.open === MATOPEN.has(id)) return; if(d.open) MATOPEN.add(id); else MATOPEN.delete(id); renderMaterials(); }
  else if(d.dataset.tp && !ED.on){ const n = +d.dataset.tp; if(d.open) ED.open.add(n); else ED.open.delete(n); }
}, true);
document.addEventListener("input", e=>{
  const t = e.target; if(!t || !t.id) return;
  if(t.id === "up-pages") UP.pages = t.value;
  else if(t.id === "who"){ WHO = t.value.slice(0,60); try{ localStorage.setItem("trbphys.who", WHO.trim()); }catch(e){} }
  else if(t.id === "imp" || t.id.indexOf("add-") === 0) DRAFT[t.id] = t.value;
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.unit){
    const n = +t.dataset.unit, has = S.completed.includes(n);
    if(t.checked && !has) S.completed.push(n);
    if(!t.checked && has) S.completed = S.completed.filter(x=>x!==n);
    S.completed.sort((a,b)=>a-b);
    P.sel = null;
    save();
    if(t.checked && !live().some(q=>q.u===n)) toast(SAMPLE ? "Added. Upload its material, or Claude will write questions when you practise it." : "Added. Ask Claude in the chat for questions from its material.");
    renderAll();
    const again = document.querySelector('[data-unit="'+n+'"]'); if(again) again.focus();
    return;
  }
  if(t.id === "up-file") return;
  if(t.id === "up-u"){ UP.u = +t.value; UP.subs = null; renderMaterials(); const el = $("#up-u"); if(el) el.focus(); return; }
  if(t.id === "up-pics"){ UP.pics = t.checked; return; }
  if(t.id === "up-done"){ UP.done = t.checked; return; }
  if(t.dataset && t.dataset.us){
    const unit = unitOf(upUnit()); const set = UP.subs ? new Set(UP.subs) : new Set(activeSubs(unit).map(s=>s.id));
    if(t.checked) set.add(t.dataset.us); else set.delete(t.dataset.us);
    UP.subs = set; renderMaterials();
    const el = document.querySelector('[data-us="'+t.dataset.us+'"]'); if(el) el.focus();
    return;
  }
  const keep = () => {
    const sel = t.dataset && t.dataset.su ? '[data-su="'+t.dataset.su+'"]' : t.dataset && t.dataset.ss ? '[data-ss="'+t.dataset.ss+'"]' : (t.name ? 'input[name="'+t.name+'"][value="'+t.value+'"]' : null);
    renderSetup(); if(sel){ const el = document.querySelector(sel); if(el) el.focus(); }
  };
  if(t.dataset && t.dataset.su){ const n = +t.dataset.su; P.sel.set(n, t.checked ? new Set(activeSubs(unitOf(n)).map(s=>s.id)) : new Set()); keep(); return; }
  if(t.dataset && t.dataset.ss){ const n = +t.dataset.u, set = P.sel.get(n) || new Set(); if(t.checked) set.add(t.dataset.ss); else set.delete(t.dataset.ss); P.sel.set(n, set); keep(); return; }
  if(t.name==="per"){ P.per = +t.value; keep(); return; }
  if(t.name==="order"){ P.order = t.value; keep(); return; }
  if(t.name==="src"){ P.src = t.value; keep(); return; }
  if(t.name==="fb"){ P.fb = t.value; keep(); return; }
});
document.addEventListener("keydown", e=>{
  const t = e.target;
  if(e.key === "Enter" && t && t.dataset && t.dataset.enter){
    e.preventDefault();
    const btn = document.querySelector('[data-act="'+t.dataset.enter+'"]'+(t.dataset.u ? '[data-u="'+t.dataset.u+'"]' : ''));
    if(btn) btn.click();
    return;
  }
  if(TAB!=="practice" || P.view!=="quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase(), it = P.items[P.i];
  const idx = ["a","b","c","d"].indexOf(k) >= 0 ? ["a","b","c","d"].indexOf(k) : ["1","2","3","4"].indexOf(k);
  if(idx >= 0 && idx < it.perm.length){ e.preventDefault(); pick(it.perm[idx]); }
  else if(k==="enter" && P.picks[P.i]!==undefined && document.activeElement && document.activeElement.dataset.act!=="pick"){ e.preventDefault(); next(); }
});
window.addEventListener("beforeunload", e=>{ if(JOB && JOB.running){ e.preventDefault(); e.returnValue = ""; } });
function renderAll(){
  keepFocus(()=>{
    renderDashboard();
    renderSyllabus();
    renderMaterials();
    renderHistory();
    if(P.view!=="quiz" && P.view!=="loading") renderPractice();
  });
}
rebuildBank();
loadLocal(lsKey);
renderAll();
showTab(TAB);
connect();
})();
