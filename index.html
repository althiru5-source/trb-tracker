<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG TRB Physics Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a revision desk. One sticky header with four tabs; content sits on flat white sheets over a cool paper ground.
   Answer options are drawn as OMR bubbles (A-D), the way the real TRB sheet is marked in ballpoint blue. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#0F1B33; --ink-2:#44516D; --ink-3:#66728C;
  --line:#D6DCE8; --grid:#E3E8F1;
  --accent:#2B3FB8; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --good:#17784A; --good-soft:#DDF3E8; --bad:#B8312F; --bad-soft:#FBE3E2; --warn:#7A5200; --warn-soft:#FBEBC8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --cx:#8A94AB;
  --c4:#8a4fd8; --c5:#0f97a8; --c6:#d1408a; --mat:#7B3FA8; --mat-soft:#F1E6FA;
  --shadow:0 1px 0 rgba(15,27,51,.04), 0 6px 18px -10px rgba(15,27,51,.18);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#141C30; --surface-2:#1A2440; --ink:#E7ECF8; --ink-2:#B4BED6; --ink-3:#8F9BB8;
    --line:#27324F; --grid:#222C47; --accent:#8EA0FF; --accent-ink:#0C1220; --accent-soft:#222C55;
    --good:#5CD39A; --good-soft:#12362A; --bad:#FF8582; --bad-soft:#41191A; --warn:#F1C15C; --warn-soft:#3D2F0D;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --cx:#6F7A94; --c4:#a477ee; --c5:#22b3c4; --c6:#e0619f; --mat:#D2A8F2; --mat-soft:#33204A; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C30; --surface-2:#1A2440; --ink:#E7ECF8; --ink-2:#B4BED6; --ink-3:#8F9BB8;
  --line:#27324F; --grid:#222C47; --accent:#8EA0FF; --accent-ink:#0C1220; --accent-soft:#222C55;
  --good:#5CD39A; --good-soft:#12362A; --bad:#FF8582; --bad-soft:#41191A; --warn:#F1C15C; --warn-soft:#3D2F0D;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --cx:#6F7A94; --c4:#a477ee; --c5:#22b3c4; --c6:#e0619f; --mat:#D2A8F2; --mat-soft:#33204A; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin-inline:auto}
h1,h2,h3,h4,p{margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:-.005em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sub{color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-3)}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin-inline:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.brand .kick{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.acct{font-size:.78rem;min-height:32px;padding:4px 0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--cx);display:inline-block}
.sync[data-s="cloud"] i{background:var(--good)}
.sync[data-s="error"] i{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;font-weight:600;color:var(--ink-2);min-height:44px;font-size:.95rem}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]:hover{color:var(--accent)}
main{padding-top:22px}
.panel[hidden]{display:none}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:18px}
.sec-head .sub{margin-top:6px}

/* surfaces */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.sheet + .sheet{margin-top:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid2 > *{min-width:0;margin-top:0!important}
.card-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-title .note{font-size:.8rem;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;min-height:36px}

/* chips + pills */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink-2);line-height:1.5}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.udot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.02em;border-radius:6px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);display:inline-block}
.tag.rel{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* syllabus */
.prog{min-width:200px}
.prog-num{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1}
.prog-num small{font-size:.85rem;font-weight:500;color:var(--ink-3);margin-left:4px;font-family:var(--f-body)}
.bar{height:8px;border-radius:4px;background:var(--grid);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.ucard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), var(--shadow)}
.uhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.uhead .l{display:flex;gap:12px;min-width:0}
.roman{font-family:var(--f-mono);font-weight:500;font-size:.8rem;border:1px solid var(--line);border-radius:6px;min-width:40px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;margin-top:1px}
.uname{font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.25;text-wrap:balance}
.umeta{font-size:.8rem;color:var(--ink-3);margin-top:3px;display:flex;gap:6px 12px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;flex:none;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:42px;height:24px;border-radius:12px;background:var(--grid);border:1px solid var(--line);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.switch input:checked + .trk{background:var(--accent);border-color:var(--accent)}
.switch input:checked + .trk::after{transform:translateX(18px);background:var(--accent-ink)}
.switch input:focus-visible + .trk{outline:2px solid var(--accent);outline-offset:2px}
details.tp summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem;list-style:none;min-height:32px;display:flex;align-items:center}
details.tp summary::-webkit-details-marker{display:none}
details.tp summary::before{content:"+";font-family:var(--f-mono);margin-right:8px;width:14px}
details.tp[open] summary::before{content:"\2212"}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.pattern{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:6px}
.pattern h4{font-family:var(--f-display);font-size:.95rem;margin-bottom:6px}
.pattern ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:.9rem}

/* practice */
.setup-row{display:grid;gap:8px;margin-bottom:18px}
.lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.sel{position:relative}
.sel input{position:absolute;opacity:0;width:1px;height:1px}
.sel span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;cursor:pointer}
.sel input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sel input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.sel input:disabled + span{opacity:.5;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--ink-3)}
.start-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ticks{display:flex;gap:4px;margin-bottom:18px}
.ticks i{flex:1;height:6px;border-radius:3px;background:var(--grid);min-width:4px}
.ticks i.cur{background:var(--accent)}
.ticks i.done{background:var(--ink-3)}
.ticks i.ok{background:var(--good)}
.ticks i.no{background:var(--bad)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.3;letter-spacing:-.005em;margin-bottom:18px;text-wrap:pretty;max-width:60ch}
.opts{display:grid;gap:10px;max-width:640px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500;color:var(--ink-2)}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.opt[disabled]{cursor:default}
.verdict{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2);max-width:640px;display:grid;gap:8px}
.verdict.ok{border-color:var(--good);background:var(--good-soft)}
.verdict.no{border-color:var(--bad);background:var(--bad-soft)}
.verdict b.v{font-family:var(--f-display);font-size:1.05rem}
.remember{border-left:3px solid var(--accent);padding-left:12px;color:var(--ink)}
.remember .lbl{display:block;margin-bottom:2px;color:var(--accent)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;max-width:640px;flex-wrap:wrap}
.score-big{font-family:var(--f-display);font-weight:700;font-size:3.2rem;line-height:1;letter-spacing:-.02em}
.score-big small{font-size:1.2rem;color:var(--ink-3);font-weight:500;margin-left:6px}
.res-top{display:flex;gap:20px 36px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.ubreak{display:grid;gap:10px;min-width:min(100%,260px);flex:1}
.review{display:grid;gap:10px;margin-top:6px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:6px}
.ritem.no{border-color:var(--bad)}
.ritem .q{font-weight:500}
.ritem .ans{font-size:.9rem;color:var(--ink-2)}

/* history */
.rem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.rem{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start}
.rem .q{font-weight:500}
.rem .mine{font-size:.85rem;color:var(--bad)}
.rem .right{font-size:.85rem;color:var(--good);font-weight:600}
.sess{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.sess + .sess{margin-top:10px}
.sess summary{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 14px;cursor:pointer;list-style:none;min-height:56px}
.sess summary::-webkit-details-marker{display:none}
.sess summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--ink-3)}
.sess[open] summary::after{content:"\2212"}
.sess .sn{font-family:var(--f-display);font-weight:600}
.sess .sd{color:var(--ink-3);font-size:.82rem}
.sess .body{padding:4px 14px 14px;border-top:1px solid var(--line);display:grid;gap:10px}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-weight:500;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--ink-2);background:var(--surface-2)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--ink-3);margin-left:4px;font-family:var(--f-body)}
.kpi .k{color:var(--ink-2);font-size:.85rem;margin-top:2px}
.focus{display:grid;gap:10px}
.frow{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0;padding-top:0}
.frow .n{font-weight:600;flex:1;min-width:160px}
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.hb .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hb .nm{display:flex;gap:8px;align-items:center;min-width:0;font-weight:500}
.hb .nm span.t{overflow-wrap:anywhere}
.hb .val{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--grid);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:0 4px 4px 0}
.track i.seen{border-radius:0 4px 4px 0}
.svgc{width:100%;height:auto;display:block;overflow:visible}
.svgc text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-2)}
.svgc .gl{stroke:var(--grid);stroke-width:1}
.svgc .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.svgc .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.svgc .hit{fill:transparent;cursor:pointer}
.svgc .vl{fill:var(--ink);font-weight:500}
.act{display:flex;gap:6px;align-items:flex-end;height:120px}
.act .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.act .b{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.act .b.zero{background:var(--grid)}
.act .d{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-3)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

#tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.78rem;max-width:260px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:70;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.28)}
@media (max-width:520px){
  .qtext{font-size:1.15rem}
  .score-big{font-size:2.6rem}
  .sheet{padding:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* v2 additions */
.tag.ex{background:var(--good-soft);color:var(--good)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start;min-width:0}
.area-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.area-h .sm{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.urow{display:grid;gap:5px;padding-top:10px;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:0;padding-top:0}
.urow .l1{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.urow .nm{display:flex;gap:8px;align-items:center;font-weight:500;min-width:0}
.urow .rt{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.loading{display:grid;gap:14px;justify-items:start;padding:8px 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--grid);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.xfer textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:10px;font-family:var(--f-mono);font-size:.75rem;resize:vertical}
.xfer .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px;align-items:center}
.flagb{font-size:.82rem;min-height:32px;padding:0}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.88rem;color:var(--ink-2)}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

/* v3: safe areas */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* v3: shared form bits */
.txt{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0 12px;width:100%;font-size:16px}
select.txt{padding-right:8px}
.txt::placeholder{color:var(--ink-3)}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem;line-height:1.4}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:none}
.check small{display:block;color:var(--ink-3);font-size:.82rem;margin-top:2px}
.linkish.danger{color:var(--bad)}
.tag.mat{background:var(--mat-soft);color:var(--mat)}
.mknote{font-size:.86rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

/* v3: syllabus editing */
.sec-tools{display:flex;gap:12px 20px;align-items:flex-end;flex-wrap:wrap}
.chip.ed{padding-right:3px}
.chip .x{border:0;background:none;width:26px;height:26px;margin:-3px 0;border-radius:50%;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;line-height:1;padding:0}
.chip .x:hover{background:var(--bad-soft);color:var(--bad)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow .txt{flex:1;min-width:0}
.addrow .btn{flex:none}
.restore{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--ink-3);margin-top:12px}
.restore button{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink-2);min-height:30px}
.restore button:hover{border-color:var(--accent);color:var(--accent)}
.ufoot{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.ucard.add{border-style:dashed;box-shadow:none;background:var(--surface-2)}
.ucard.add .uname{margin-bottom:2px}
.matcount{color:var(--mat);font-weight:600}

/* v3: practice scope */
.scopes{display:grid;gap:8px}
.scope{border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:var(--surface-2)}
.scope-h{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.scope-h .linkish{font-size:.85rem}
.scope-subs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 4px 2px}
.sel.sm span{min-height:38px;padding:0 10px;font-size:.86rem;font-weight:500}
.cnt{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);margin-left:2px}
.sel input:checked + span .cnt{color:inherit;opacity:.75}
.mini{display:flex;gap:16px;width:100%;padding-left:4px}
.mini .linkish{min-height:32px;font-size:.85rem}

/* v3: materials */
.upform{display:grid;gap:18px}
.upform .setup-row{margin-bottom:0}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;background:var(--surface-2);font-size:.9rem;min-height:44px}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.file .sz{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3);white-space:nowrap}
.file .x{border:0;background:none;width:36px;height:36px;border-radius:8px;color:var(--ink-3);font-size:1.1rem}
.file .x:hover{background:var(--bad-soft);color:var(--bad)}
.pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.job{display:grid;gap:12px}
.job .row1{display:flex;gap:14px;align-items:center}
.job h3{overflow-wrap:anywhere}
.jobbar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.jobbar i{display:block;height:100%;background:var(--mat);transition:width .4s ease}
.jres{display:grid;gap:4px;border-left:3px solid var(--mat);padding-left:12px}
.jres.bad{border-left-color:var(--bad)}
.jres b{overflow-wrap:anywhere}
.mats{display:grid;gap:10px}
.mgroup + .mgroup{margin-top:18px}
.mgroup h4{font-family:var(--f-display);font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mat{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mat .mh{padding:12px 14px;display:grid;gap:6px}
.mat .mn{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.mat .mm{font-size:.82rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 12px}
.mat .ma{display:flex;gap:2px 18px;flex-wrap:wrap;align-items:center}
.mat details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;list-style:none;min-height:36px;display:flex;align-items:center}
.mat details summary::-webkit-details-marker{display:none}
.mqs{border-top:1px solid var(--line)}
.mq{padding:10px 14px;display:grid;gap:4px;font-size:.9rem;border-bottom:1px solid var(--line)}
.mq:last-child{border-bottom:0}
.mq .ans{color:var(--good);font-weight:600}
.mq .meta{font-size:.78rem;color:var(--ink-3);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.mq.flagged{opacity:.55}
.mmore{padding:10px 14px}
@media (max-width:520px){
  .tabs{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:0}
  .tab{font-size:clamp(.7rem, 3.1vw, .85rem);padding-inline:2px}
}
.uhead{flex-wrap:wrap}
.uhead .l{flex:1 1 210px}

.sel input[data-state="some"] + span{border-color:var(--accent);border-style:dashed;color:var(--accent)}

<script>
/* ===== HOSTED COPY: connection settings (filled in by Claude) ===== */
const FIREBASE_CONFIG = {
  "apiKey": "AIzaSyDaExLtg6_HgOlzb_9OWPEWA2n9UeJeTSM",
  "authDomain": "pgtrp-4223a.firebaseapp.com",
  "projectId": "pgtrp-4223a",
  "storageBucket": "pgtrp-4223a.firebasestorage.app",
  "messagingSenderId": "821078659592",
  "appId": "1:821078659592:web:180b9574e57499ff0677bd"
};
const OWNER_EMAIL = "al.thiru6@gmail.com";
/* ================================================================== */
/* Runs the tracker on Firebase instead of claude.ai. Firestore keeps the shared record, and
   Google sign-in tells the owner apart from everyone else who opens the link. */
(function(){
  const H = window.HOST = {ok:false, user:null, owner:false, usedOwner:null, msg:""};
  let vid = null;
  try{ vid = localStorage.getItem("trbphys.vid"); }catch(e){}
  if(!vid || !/^v[a-z0-9]{8,24}$/.test(vid)){ vid = "v" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); try{ localStorage.setItem("trbphys.vid", vid); }catch(e){} }
  H.vid = vid;
  let fs = null, auth = null;
  const configured = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && window.firebase);
  const isOwnerUser = u => !!(u && u.emailVerified && u.email && OWNER_EMAIL.indexOf("@") > 0 && u.email.toLowerCase() === OWNER_EMAIL.toLowerCase());
  H.ready = new Promise(resolve=>{
    if(!configured){ H.msg = window.firebase ? "setup" : "offline"; resolve(false); return; }
    try{ firebase.initializeApp(FIREBASE_CONFIG); fs = firebase.firestore(); auth = firebase.auth(); }
    catch(e){ H.msg = "setup"; resolve(false); return; }
    let first = true;
    const fin = () => { H.ok = true; resolve(true); };
    auth.onAuthStateChanged(u=>{
      H.user = u; H.owner = isOwnerUser(u);
      paintAcct();
      /* sign-in finished after the page had already started as a visitor (or the other way round) */
      if(!first && H.usedOwner !== null && H.usedOwner !== H.owner) location.reload();
      first = false; fin();
    });
    setTimeout(fin, 6000);
  });
  /* Firestore can't hold arrays inside arrays (each test is a list of [question, answer] pairs),
     so every document is stored as one JSON string in a field called j. */
  const ERR = {"permission-denied":"not_granted", "unauthenticated":"not_granted", "resource-exhausted":"quota_exceeded", "invalid-argument":"invalid_argument"};
  const wrapErr = e => ({code: ERR[e && e.code] || "unavailable", message: (e && e.message) || ""});
  const dec = d => { if(d && typeof d.j === "string"){ try{ return JSON.parse(d.j); }catch(e){ return null; } } return d || null; };
  const enc = d => ({j: JSON.stringify(d)});
  function wDoc(r){
    return {
      id: r.id, path: r.path,
      set: d => r.set(enc(d)).catch(e=>{ throw wrapErr(e); }),
      update: d => r.get().then(s=>r.set(enc(Object.assign({}, dec(s.data()) || {}, d)))).catch(e=>{ throw wrapErr(e); }),
      delete: () => r.delete().catch(e=>{ throw wrapErr(e); }),
      get: () => r.get().then(s=>({id:s.id, exists:s.exists, data:()=>dec(s.data())})).catch(e=>{ throw wrapErr(e); }),
      onSnapshot: (next, err) => r.onSnapshot(s=>next({id:s.id, exists:s.exists, data:()=>dec(s.data())}), e=>{ if(err) err(wrapErr(e)); }),
      collection: c => wColl(r.collection(c))
    };
  }
  function wQuery(q){
    return {
      docs: s => s.docs.map(d=>({id:d.id, exists:true, data:()=>dec(d.data())})),
      get(){ return q.get().then(s=>({docs:this.docs(s), size:s.size, empty:s.empty})).catch(e=>{ throw wrapErr(e); }); },
      onSnapshot(next, err){ return q.onSnapshot(s=>next({docs:this.docs(s), size:s.size, empty:s.empty}), e=>{ if(err) err(wrapErr(e)); }); }
    };
  }
  function wColl(c){ return Object.assign(wQuery(c), {path: c.path, doc: id => wDoc(id ? c.doc(id) : c.doc())}); }
  const DBW = {doc: p => wDoc(fs.doc(p)), collection: p => wColl(fs.collection(p))};
  const USER = {
    id: async () => H.owner ? H.user.uid : H.vid,
    isOwner: async () => { H.usedOwner = H.owner; return H.owner; },
    canEdit: async () => H.owner,
    can: async () => true
  };
  window.claude = {use: async name => {
    const ok = await H.ready;
    if(!ok) return null;
    if(name === "db") return DBW;
    if(name === "user") return USER;
    return null;   /* Claude itself doesn't run here */
  }};

  /* ---- owner sign-in button in the header ---- */
  function say(msg){ const t = document.getElementById("toast"); if(!t) return; t.textContent = msg; t.hidden = false; clearTimeout(say.t); say.t = setTimeout(()=>{ t.hidden = true; }, 6000); }
  function paintAcct(){
    const b = document.getElementById("acct"); if(!b) return;
    if(!configured){ b.hidden = true; return; }
    b.hidden = false;
    b.textContent = H.owner ? "Owner · Sign out" : H.user ? "Not the owner account · Sign out" : "Owner sign-in";
  }
  H.paintAcct = paintAcct;
  document.addEventListener("click", e=>{
    const b = e.target.closest && e.target.closest("#acct"); if(!b || !auth) return;
    if(H.user){ auth.signOut().then(()=>location.reload()); return; }
    const prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({prompt:"select_account"});
    auth.signInWithPopup(prov).then(r=>{
      if(!isOwnerUser(r.user)) say("That Google account isn’t the owner’s, so this browser stays a visitor.");
      setTimeout(()=>location.reload(), isOwnerUser(r.user) ? 0 : 2500);
    }).catch(err=>{
      const c = err && err.code;
      if(c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return;
      if(c === "auth/unauthorized-domain") say("Sign-in is blocked on this address. Add “"+location.hostname+"” in Firebase → Authentication → Settings → Authorized domains.");
      else if(c === "auth/popup-blocked") say("Your browser blocked the sign-in window. Allow pop-ups for this site and try again.");
      else say("Sign-in didn’t work ("+(c || "unknown error")+"). Try again.");
    });
  });
  document.addEventListener("DOMContentLoaded", paintAcct);
})();
</script>

  {id:"d06",u:3,t:"Electrostatics",q:"Gauss's law states that the total electric flux through a closed surface equals:",o:["The charge enclosed divided by ε₀","The permeability times current","Zero always","The potential at the surface"],a:0,w:"∯E·dA = Q_enc/ε₀.",r:"Flux depends only on enclosed charge, not on the surface shape.",p:"Related · TRB 2025 Q57, Q135"},
  {id:"d07",u:3,t:"Magnetostatics",q:"The Biot–Savart law gives the magnetic field due to:",o:["A moving charge only","A small current element","A static charge","A changing electric field only"],a:1,w:"dB = (μ₀/4π) I dl × r̂ / r² for a current element.",r:"Biot–Savart is to magnetostatics what Coulomb's law is to electrostatics.",p:"Related · TRB 2019 Q38 (B at the centre of a coil)"},
  {id:"d08",u:3,t:"Maxwell & waves",q:"Which of Maxwell's equations directly implies that magnetic monopoles do not exist?",o:["∇·E = ρ/ε₀","∇·B = 0","∇×E = −∂B/∂t","∇×B = μ₀J + μ₀ε₀∂E/∂t"],a:1,w:"∇·B = 0 means B-field lines never begin or end.",r:"∇·B = 0 ⇒ net magnetic flux through any closed surface is zero.",p:"Related · TRB 2019 Q40"},
  {id:"d09",u:3,t:"Maxwell & waves",q:"The Poynting vector physically represents:",o:["Electric field strength","Magnetic flux density","Power flow per unit area","Charge density"],a:2,w:"S = E×H gives energy flow per unit area per unit time (W/m²).",r:"S = E × H = (E × B)/μ₀, in the direction the wave travels.",p:"Related · TRB 2025 Q115"},
  {id:"d10",u:3,t:"Maxwell & waves",q:"Maxwell introduced the displacement current term to make Ampère's law consistent with:",o:["Gauss's law","The equation of continuity (charge conservation)","Faraday's law","Coulomb's law"],a:1,w:"Without it, ∇·(∇×B) = 0 would contradict ∇·J = −∂ρ/∂t.",r:"Displacement current = ε₀ ∂E/∂t. It fixes charge conservation in Ampère's law.",p:"Related · TRB 2025 Q93, 2019 Q106"},
  {id:"d11",u:4,t:"Foundations",q:"The de Broglie wavelength of a particle of momentum p is given by:",o:["λ = h/p","λ = p/h","λ = hp","λ = h²/p"],a:0,w:"Every particle has a wavelength λ = h/p.",r:"λ = h/p. For an electron accelerated through V volts, λ ≈ 12.27/√V Å."},
  {id:"d12",u:4,t:"Foundations",q:"Heisenberg's uncertainty principle is mathematically expressed as:",o:["Δx·Δp = 0","Δx·Δp ≥ ħ/2","Δx = Δp","Δx + Δp = ħ"],a:1,w:"Position and momentum cannot both be sharp: Δx·Δp ≥ ħ/2.",r:"Δx·Δp ≥ ħ/2 and ΔE·Δt ≥ ħ/2.",p:"Related · TRB 2019 Q98, 2025 Q139"},
  {id:"d13",u:4,t:"Foundations",q:"The time-independent Schrödinger equation is written as:",o:["Hψ = Eψ","ψ = Hψ","EH = ψ","H = Eψ²"],a:0,w:"It is an eigenvalue equation: the Hamiltonian acting on ψ returns E times ψ.",r:"Hψ = Eψ with H = −(ħ²/2m)∇² + V.",p:"Related · TRB 2025 Q77"},
  {id:"d14",u:4,t:"Foundations",q:"For a wavefunction to be physically acceptable, it must be single-valued, continuous, and:",o:["Real","Normalizable (finite/square-integrable)","Zero everywhere","Time-independent"],a:1,w:"∫|ψ|²dx must be finite so that probabilities can be defined.",r:"Acceptable ψ: single-valued, continuous, finite, normalisable (and ψ′ continuous where V is finite)."},
  {id:"d15",u:4,t:"Eigenvalue problems",q:"The ground state (n = 1) energy of a particle in a 1D infinite potential box of width L is:",o:["E₁ = h²/(8mL²)","E₁ = h/(2mL)","E₁ = mL²/h²","E₁ = h²/(2mL)"],a:0,w:"Eₙ = n²h²/(8mL²), so n = 1 gives h²/(8mL²).",r:"Eₙ = n²h²/(8mL²). Lowest level is not zero.",p:"Related · TRB 2025 Q59, 2019 Q7"},

  /* ===== Unit I – Mathematical Physics ===== */
  {id:"m01",u:1,t:"Vector calculus",q:"The gradient of a scalar field is a:",o:["Vector","Scalar","Tensor of rank 2","Pseudoscalar only"],a:0,w:"∇φ has three components and points in the direction of steepest increase of φ.",r:"grad: scalar → vector. div: vector → scalar. curl: vector → vector."},
  {id:"m02",u:1,t:"Vector calculus",q:"The divergence of the curl of any vector field, ∇·(∇×A), is:",o:["Zero","A itself","∇²A","A unit scalar"],a:0,w:"Mixed partial derivatives cancel in pairs.",r:"∇·(∇×A) = 0 and ∇×(∇φ) = 0. Learn them as a pair."},
  {id:"m03",u:1,t:"Vector calculus",q:"The Laplacian ∇²φ of a scalar field φ is equal to:",o:["∇·(∇φ)","∇×(∇φ)","∇(∇×φ)","(∇φ)·φ"],a:0,w:"∇² = ∇·∇ = ∂²/∂x² + ∂²/∂y² + ∂²/∂z² in Cartesian coordinates.",r:"Laplacian = divergence of the gradient."},
  {id:"m04",u:1,t:"Special functions",q:"The value of Γ(½) is:",o:["√π","π","1","√(π/2)"],a:0,w:"Γ(½) = ∫₀^∞ t^(−½)e^(−t) dt = √π, which follows from the Gaussian integral.",r:"Γ(½) = √π, Γ(1) = 1, Γ(n+1) = nΓ(n).",p:"PYQ · TRB 2025 Q60"},
  {id:"m05",u:1,t:"Special functions",q:"For a positive integer n, Γ(n+1) equals:",o:["n!","(n+1)!","(n−1)!","nⁿ"],a:0,w:"Repeating Γ(n+1) = nΓ(n) down to Γ(1) = 1 gives n!.",r:"Γ(n+1) = n! for integer n. Γ(n+1) = nΓ(n) for any n > 0.",p:"Related · TRB 2019 Q71 (Gamma-function integral)"},
  {id:"m06",u:1,t:"Matrices",q:"The Cayley–Hamilton theorem states that every square matrix:",o:["Is diagonalisable","Satisfies its own characteristic equation","Has only real eigenvalues","Equals its transpose"],a:1,w:"If p(λ) = det(A − λI), then p(A) = 0.",r:"Use it to find A⁻¹ and higher powers of A without direct multiplication.",p:"Related · TRB 2019 Q47, 2025 Q55 (eigenvalues)"},
  {id:"m07",u:1,t:"Matrices",q:"The eigenvalues of a Hermitian matrix are always:",o:["Purely imaginary","Real","Complex with unit modulus","Zero"],a:1,w:"For Hermitian H, ⟨v|H|v⟩ is real, which forces real eigenvalues.",r:"Hermitian: real eigenvalues. Unitary: |λ| = 1. Anti-Hermitian: imaginary."},
  {id:"m08",u:1,t:"Probability",q:"The mean of a binomial distribution with n trials and success probability p is:",o:["np","npq","√(npq)","n/p"],a:0,w:"Each trial contributes p on average, so the mean is np.",r:"Binomial: mean np, variance npq (q = 1 − p). Poisson: mean = variance = λ.",p:"PYQ · TRB 2025 Q107"},
  {id:"m09",u:1,t:"Probability",q:"For a Poisson distribution with parameter λ, the mean and the variance are:",o:["Both equal to λ","λ and λ²","λ and √λ","Both equal to 1/λ"],a:0,w:"For the Poisson law P(k) = e^(−λ)λ^k/k!, both moments equal λ.",r:"Poisson: mean = variance = λ. It is the limit of the binomial for large n, small p.",p:"PYQ · TRB 2025 Q101"},
  {id:"m10",u:1,t:"Complex analysis",q:"If f(z) is analytic inside and on a simple closed contour C, then ∮_C f(z) dz equals:",o:["Zero","2πi","2πi f(0)","f(z)"],a:0,w:"This is Cauchy's integral theorem.",r:"Cauchy theorem: ∮f dz = 0. Cauchy formula: f(a) = (1/2πi)∮ f(z)/(z−a) dz."},
  {id:"m11",u:1,t:"Complex analysis",q:"In the Laurent expansion of f(z) about a singular point a, the coefficient of (z−a)⁻¹ is called the:",o:["Residue","Order of the pole","Branch point","Modulus"],a:0,w:"The residue is the (z−a)⁻¹ coefficient. ∮f dz = 2πi × (sum of residues inside).",r:"Residue theorem: ∮ f dz = 2πi Σ Res."},
  {id:"m12",u:1,t:"Fourier & transforms",q:"The Fourier series of an even function f(x) on [−L, L] contains only:",o:["Cosine terms (and a constant)","Sine terms","Sine and cosine terms equally","Exponentials only"],a:0,w:"Even functions have bₙ = 0, so only the constant and cosine terms survive.",r:"Even → cosines only. Odd → sines only.",p:"Related · TRB 2025 Q73 (Σ1/n² via a Fourier series)"},
  {id:"m13",u:1,t:"Special functions",q:"Legendre polynomials Pₙ(x) are orthogonal over the interval:",o:["−1 to 1","0 to ∞","−∞ to ∞","0 to 1"],a:0,w:"∫₋₁¹ Pₘ Pₙ dx = 2δₘₙ/(2n+1).",r:"Legendre: [−1, 1]. Hermite: (−∞, ∞) with e^(−x²). Laguerre: [0, ∞) with e^(−x).",p:"Related · TRB 2019 Q36, 2025 Q61"},
  {id:"m14",u:1,t:"Special functions",q:"Hermite polynomials Hₙ(x) are orthogonal over (−∞, ∞) with weight function:",o:["e^(−x²)","e^(−x)","1","1/√(1−x²)"],a:0,w:"∫ Hₘ Hₙ e^(−x²) dx = 0 for m ≠ n.",r:"Hermite weight e^(−x²). The same polynomials appear in the quantum harmonic oscillator.",p:"Related · TRB 2019 Q35, 2025 Q121"},
  {id:"m15",u:1,t:"Dimensional analysis",q:"The dimensional formula of energy (work) is:",o:["[M L² T⁻²]","[M L T⁻²]","[M L² T⁻¹]","[M L⁻¹ T⁻²]"],a:0,w:"Energy = force × distance = [M L T⁻²][L] = [M L² T⁻²].",r:"Force [MLT⁻²]; energy [ML²T⁻²]; power [ML²T⁻³]; pressure [ML⁻¹T⁻²]."},

  /* ===== Unit III – Electromagnetic Theory ===== */
  {id:"e01",u:3,t:"Electrostatics",q:"The electrostatic force between two point charges varies with their separation r as:",o:["1/r²","1/r","1/r³","r²"],a:0,w:"Coulomb's inverse-square law: F = q₁q₂/(4πε₀r²).",r:"Point-charge field ∝ 1/r², dipole field ∝ 1/r³.",p:"PYQ · TRB 2019 Q51"},
  {id:"e02",u:3,t:"Magnetostatics",q:"The SI unit of magnetic permeability μ is:",o:["Henry per metre","Farad per metre","Ohm metre","Tesla"],a:0,w:"μ = B/H, which has units T·m/A = H/m.",r:"μ: H/m. ε: F/m. Tesla is the unit of B, not μ.",p:"PYQ · TRB 2019 Q58"},
  {id:"e03",u:3,t:"Electrostatics",q:"Poisson's equation for the electrostatic potential V in vacuum is:",o:["∇²V = −ρ/ε₀","∇²V = 0","∇·V = ρ/ε₀","∇×V = −ρ/ε₀"],a:0,w:"Combine E = −∇V with ∇·E = ρ/ε₀.",r:"Poisson: ∇²V = −ρ/ε₀. Laplace (ρ = 0): ∇²V = 0.",p:"PYQ · TRB 2025 Q111, 2019 Q11"},
  {id:"e04",u:3,t:"Electrostatics",q:"Laplace's equation ∇²V = 0 holds in a region where:",o:["There is no free charge","The field is uniform","The potential is infinite","The current density is zero"],a:0,w:"Setting ρ = 0 in Poisson's equation gives Laplace's equation.",r:"Laplace: charge-free region. A solution is fixed uniquely by its boundary values."},
  {id:"e05",u:3,t:"Magnetostatics",q:"Ampère's circuital law (static form) states that ∮B·dl equals:",o:["μ₀ × enclosed current","ε₀ × enclosed charge","Zero always","−dΦ/dt"],a:0,w:"∮B·dl = μ₀I_enc.",r:"Maxwell added a displacement-current term: ∮B·dl = μ₀I + μ₀ε₀ dΦ_E/dt."},
  {id:"e06",u:3,t:"Maxwell & waves",q:"Faraday's law of induction in differential form is:",o:["∇×E = −∂B/∂t","∇·E = −∂B/∂t","∇×B = −∂E/∂t","∇·B = −∂E/∂t"],a:0,w:"A changing magnetic field produces a circulating electric field.",r:"∇·E = ρ/ε₀; ∇·B = 0; ∇×E = −∂B/∂t; ∇×B = μ₀J + μ₀ε₀∂E/∂t."},
  {id:"e07",u:3,t:"Maxwell & waves",q:"The speed of electromagnetic waves in vacuum is:",o:["1/√(μ₀ε₀)","√(μ₀ε₀)","μ₀/ε₀","1/(μ₀ε₀)"],a:0,w:"Maxwell's equations give the wave equation with v² = 1/(μ₀ε₀) = c².",r:"c = 1/√(μ₀ε₀). In a medium v = 1/√(με)."},
  {id:"e08",u:3,t:"Maxwell & waves",q:"Electromagnetic waves in free space are:",o:["Transverse: E, B and the direction of travel are mutually perpendicular","Longitudinal","Transverse with E parallel to B","Longitudinal with E along the direction of travel"],a:0,w:"E and B oscillate in phase, at right angles to each other and to k.",r:"EM waves in free space: transverse, E ⟂ B ⟂ k, E/B = c."},
  {id:"e09",u:3,t:"Maxwell & waves",q:"The equation of continuity, expressing conservation of charge, is:",o:["∇·J + ∂ρ/∂t = 0","∇×J = ∂ρ/∂t","∇·J = ρ","∇²J = 0"],a:0,w:"Current flowing out of a volume equals the rate at which its charge decreases.",r:"∇·J = −∂ρ/∂t.",p:"PYQ · TRB 2019 Q106, 2025 Q93"},
  {id:"e10",u:3,t:"Maxwell & waves",q:"The energy stored per unit volume in an electromagnetic field is:",o:["½(ε₀E² + B²/μ₀)","ε₀E·B","E×B/μ₀","½ε₀μ₀EB"],a:0,w:"Electric part ½ε₀E² plus magnetic part B²/(2μ₀).",r:"Energy density u = ½(ε₀E² + B²/μ₀). Energy flow S = E×B/μ₀.",p:"PYQ · TRB 2025 Q115"},
  {id:"e11",u:3,t:"Maxwell & waves",q:"Poynting's theorem is a statement of conservation of:",o:["Energy","Charge","Linear momentum only","Angular momentum"],a:0,w:"Decrease in field energy = energy flowing out (∮S·da) + work done on charges.",r:"Poynting theorem = energy conservation for the EM field."},
  {id:"e12",u:3,t:"Potentials & radiation",q:"The Lorenz gauge condition is:",o:["∇·A = −μ₀ε₀ ∂φ/∂t","∇·A = 0","∇×A = 0","∇·A = μ₀J"],a:0,w:"This choice decouples the equations for φ and A into wave equations.",r:"Lorenz gauge: ∇·A + μ₀ε₀ ∂φ/∂t = 0. Coulomb gauge: ∇·A = 0.",p:"PYQ · TRB 2019 Q74"},
  {id:"e13",u:3,t:"Currents & media",q:"Ohm's law in point (microscopic) form is:",o:["J = σE","J = E/σ²","J = σ/E","J = σ∇·E"],a:0,w:"Current density is proportional to the electric field, with conductivity σ as the constant.",r:"J = σE and σ = 1/ρ.",p:"PYQ · TRB 2019 Q60"},
  {id:"e14",u:3,t:"Magnetostatics",q:"The magnetic vector potential A is defined through:",o:["B = ∇×A","B = ∇·A","B = ∇A","B = ∂A/∂t"],a:0,w:"Because ∇·B = 0, B can always be written as a curl.",r:"B = ∇×A and E = −∇φ − ∂A/∂t."},
  {id:"e15",u:3,t:"Potentials & radiation",q:"The total power radiated by an oscillating electric dipole varies with angular frequency ω as:",o:["ω⁴","ω²","ω","ω⁻²"],a:0,w:"Radiation comes from the acceleration of the charges, and the power goes as (acceleration)².",r:"Dipole radiation: P ∝ ω⁴ (∝ 1/λ⁴). Angular pattern ∝ sin²θ.",p:"PYQ · TRB 2019 Q33"},
  {id:"e16",u:3,t:"Electrostatics",q:"The differential form of Gauss's law for electricity is:",o:["∇·E = ρ/ε₀","∇×E = ρ/ε₀","∇·B = ρ/ε₀","∇²E = ρ"],a:0,w:"Apply the divergence theorem to ∯E·dA = Q/ε₀.",r:"∇·E = ρ/ε₀ (charges are the sources of E).",p:"PYQ · TRB 2025 Q135"},

  /* ===== Unit IV – Quantum Mechanics ===== */
  {id:"q01",u:4,t:"Foundations",q:"Black-body radiation was successfully explained by assuming that energy is exchanged in discrete quanta of:",o:["E = hν","E = ½kT","E = mc²","E = pv"],a:0,w:"Planck's 1900 quantum hypothesis.",r:"Planck: E = hν. Einstein: photoelectric effect. de Broglie: λ = h/p."},
  {id:"q02",u:4,t:"Eigenvalue problems",q:"The zero-point (ground-state) energy of a linear harmonic oscillator of angular frequency ω is:",o:["½ħω","ħω","0","3ħω/2"],a:0,w:"Eₙ = (n + ½)ħω, so n = 0 gives ½ħω.",r:"Eₙ = (n + ½)ħω. Levels are equally spaced by ħω.",p:"PYQ · TRB 2019 Q29"},
  {id:"q03",u:4,t:"Operators & angular momentum",q:"In the harmonic oscillator, the raising operator a† acting on |n⟩ gives a state proportional to:",o:["|n+1⟩","|n−1⟩","|n⟩","|0⟩"],a:0,w:"a†|n⟩ = √(n+1)|n+1⟩.",r:"a†|n⟩ = √(n+1)|n+1⟩, a|n⟩ = √n|n−1⟩, a|0⟩ = 0."},
  {id:"q04",u:4,t:"Operators & angular momentum",q:"The commutator [x, pₓ] equals:",o:["iħ","ħ","0","−ħ²"],a:0,w:"[x, p]ψ = x(−iħψ′) − (−iħ)(xψ)′ = iħψ.",r:"[x, p] = iħ. [Lₓ, Lᵧ] = iħL_z. Non-commuting operators ⇒ uncertainty relation."},
  {id:"q05",u:4,t:"Operators & angular momentum",q:"For orbital angular momentum quantum number l, the eigenvalue of L² is:",o:["l(l+1)ħ²","l²ħ²","lħ","(l+½)ħ²"],a:0,w:"L²Y_lm = l(l+1)ħ²Y_lm.",r:"L² → l(l+1)ħ². L_z → mħ, with m = −l … +l (2l+1 values).",p:"PYQ · TRB 2019 Q1"},
  {id:"q06",u:4,t:"Eigenvalue problems",q:"For the particle-in-a-box state ψₙ = √(2/L) sin(nπx/L), the expectation value ⟨p⟩ is:",o:["Zero","nπħ/L","ħ/L","Infinite"],a:0,w:"ψ is a standing wave made of equal +k and −k parts, so the average momentum cancels. ⟨p²⟩ = (nπħ/L)² is not zero.",r:"A real wave function has ⟨p⟩ = 0. Do not confuse ⟨p⟩ with ⟨p²⟩.",p:"PYQ · TRB 2019 Q72"},
  {id:"q07",u:4,t:"Spin & relativistic QM",q:"Which relation holds for the Pauli spin matrices?",o:["σₓ² = σᵧ² = σ_z² = I","σₓ² = −I","σₓσᵧ = σᵧσₓ","Tr(σₓ) = 1"],a:0,w:"Each Pauli matrix squares to the identity. They also anticommute and are traceless.",r:"Pauli matrices: Hermitian, traceless, square to I, anticommute (σₓσᵧ = iσ_z).",p:"Related · TRB 2025 Q34"},
  {id:"q08",u:4,t:"Spin & relativistic QM",q:"The Stern–Gerlach experiment provided direct evidence for:",o:["Space quantisation of angular momentum (electron spin)","The wave nature of electrons","The photoelectric effect","Nuclear fission"],a:0,w:"A silver-atom beam split into discrete components in an inhomogeneous magnetic field.",r:"Stern–Gerlach: space quantisation. Later read as evidence for electron spin ½.",p:"PYQ · TRB 2019 Q25"},
  {id:"q09",u:4,t:"Eigenvalue problems",q:"Quantum tunnelling means that a particle can:",o:["Cross a potential barrier higher than its energy","Gain energy from the vacuum","Travel faster than light","Stay at rest with zero momentum"],a:0,w:"The wave function decays inside the barrier but is non-zero on the far side.",r:"Transmission falls roughly as e^(−2κa), where κ = √(2m(V₀−E))/ħ."},
  {id:"q10",u:4,t:"Approximation methods",q:"The variational method gives, for the ground-state energy, a trial value that is always:",o:["Greater than or equal to the true ground-state energy","Less than or equal to the true value","Exactly equal to it","Zero"],a:0,w:"Any trial function is a mixture of eigenstates, so ⟨H⟩ ≥ E₀.",r:"E_trial ≥ E₀: an upper bound. A better trial function gives a lower value.",p:"PYQ · TRB 2019 Q34"},
  {id:"q11",u:4,t:"Approximation methods",q:"Fermi's golden rule gives:",o:["The transition rate per unit time","The ground-state energy","The scattering phase shift","The commutator of x and p"],a:0,w:"Rate = (2π/ħ)|⟨f|H′|i⟩|² ρ(E_f).",r:"Golden rule = time-dependent perturbation theory → transition probability per unit time."},
  {id:"q12",u:4,t:"Eigenvalue problems",q:"Degeneracy of an energy level means:",o:["Several independent eigenfunctions share the same eigenvalue","The level lies at zero energy","The wave function is not normalisable","The level is unstable"],a:0,w:"Different states, same energy. Perturbations may split the level.",r:"Degenerate = same eigenvalue, many eigenfunctions. Needs degenerate perturbation theory.",p:"PYQ · TRB 2019 Q81"},
  {id:"q13",u:4,t:"Spin & relativistic QM",q:"The Klein–Gordon equation describes:",o:["Relativistic spin-0 particles","Non-relativistic electrons","Spin-½ particles only","Photons only"],a:0,w:"It comes from E² = p²c² + m²c⁴ and is second order in time.",r:"Klein–Gordon: spin 0. Dirac: spin ½ (first order in time).",p:"Related · TRB 2019 Q59, 2025 Q85"},
  {id:"q14",u:4,t:"Spin & relativistic QM",q:"A major success of the Dirac equation was predicting:",o:["Antiparticles (the positron) and electron spin ½","Photon polarisation","Neutron decay","Superconductivity"],a:0,w:"Negative-energy solutions led to the positron, and spin ½ came out automatically.",r:"Dirac equation → spin ½, magnetic moment g = 2, antimatter.",p:"Related · TRB 2019 Q100, 2025 Q85"},
  {id:"q15",u:4,t:"Eigenvalue problems",q:"The ground-state energy of the hydrogen atom is:",o:["−13.6 eV","+13.6 eV","−3.4 eV","−27.2 eV"],a:0,w:"Eₙ = −13.6 eV/n², with n = 1.",r:"Eₙ = −13.6/n² eV. n = 2 gives −3.4 eV."},
  {id:"q16",u:4,t:"Foundations",q:"In the Born interpretation, |ψ(x, t)|² represents:",o:["The probability density of finding the particle","The particle's momentum","The potential energy","The total energy"],a:0,w:"∫|ψ|² dx over a region is the probability of finding the particle there.",r:"|ψ|² = probability density. Normalisation: ∫|ψ|² dx = 1."},

  /* ===== Real questions from the TRB 2019 Physics paper (wording as printed; answers from the tentative key) ===== */
  {id:"y19_002",u:1,t:"Probability",x:true,q:"Which of these is not a characteristic of Poisson distribution? (Given: p or q are success or failure, n is the number of events, m is the Poisson distribution parameter)",o:["n is small and p is large","n is large and p is small","p is close to zero, the distribution is J shaped","entire distribution can be obtained from single parameter 'm'"],a:0,w:"The Poisson law applies when n is large and p is small, with m = np. The whole distribution depends on the single parameter m. So 'n small and p large' is the odd one out.",r:"Poisson: n large, p small, m = np, one parameter m, mean = variance = m.",p:"PYQ · TRB 2019 Q2"},
  {id:"y19_003",u:1,t:"Number systems",x:true,q:"The number (100101)₂ is equivalent to octal ________.",o:["54","45","37","26"],a:1,w:"Group the bits in threes from the right: 100 | 101 = 4 | 5, which is 45 in octal.",r:"Binary to octal: groups of 3 bits. Binary to hex: groups of 4 bits.",p:"PYQ · TRB 2019 Q3"},
  {id:"y19_026",u:1,t:"Group theory",x:true,q:"Two groups G and G′ of the same order having a one-to-one correspondence between their elements is called:",o:["Homomorphism","Isomorphism","Automorphism","Endomorphism"],a:1,w:"A one-to-one, operation-preserving correspondence between two groups is an isomorphism.",r:"Homomorphism preserves the operation. Isomorphism is a bijective homomorphism. Automorphism is an isomorphism of a group onto itself.",p:"PYQ · TRB 2019 Q26"},
  {id:"y19_079",u:1,t:"Group theory",x:true,q:"If the determinant of unitary matrices of order 'n' is +1, then the subgroup is denoted by:",o:["FLG(n)","SU(n)","D(n)","C(n)"],a:1,w:"Unitary matrices form U(n). Those with determinant +1 form the special unitary group SU(n).",r:"U(n): unitary. SU(n): unitary with det = +1. O(n): orthogonal. SO(n): orthogonal with det = +1.",p:"PYQ · TRB 2019 Q79"},
  {id:"y19_099",u:1,t:"Probability",x:true,q:"The life of an electronic device has a mean of 300 hours and a standard deviation of 25 hours. Assuming a normal distribution of lifetimes, find the probability that any one of these devices will have a lifetime of more than 350 hours.",o:["2","0.4772","1","0.0228"],a:3,w:"z = (350 − 300)/25 = 2. The area beyond z = 2 is 0.5 − 0.4772 = 0.0228.",r:"Normal table: area from 0 to z = 2 is 0.4772, so the tail beyond it is 0.0228. A probability can never exceed 1.",p:"PYQ · TRB 2019 Q99"},

function defSyl(){ return {units: DEF_UNITS.map(u=>({n:u.n, name:u.name, subs:u.subs.map((s,i)=>({id:"u"+u.n+"s"+(i+1), name:s}))}))}; }
function normSyl(raw){
  const def = defSyl(), out = {units:[]}, seenU = new Set();
  (raw && Array.isArray(raw.units) ? raw.units : []).forEach(u=>{
    if(!u || !Number.isInteger(u.n) || u.n<1 || u.n>99 || seenU.has(u.n) || typeof u.name!=="string" || !u.name.trim()) return;
    seenU.add(u.n);
    const d = def.units.find(x=>x.n===u.n), subs = [], seenS = new Set();
    (Array.isArray(u.subs) ? u.subs : []).forEach(s=>{
      if(!s || typeof s.id!=="string" || !s.id || seenS.has(s.id) || typeof s.name!=="string" || !s.name.trim()) return;
      seenS.add(s.id);
      const o = {id:s.id, name:s.name.slice(0,120)}; if(s.off) o.off = true; if(s.custom) o.custom = true; subs.push(o);
    });
    if(d) d.subs.forEach(s=>{ if(!seenS.has(s.id)){ seenS.add(s.id); subs.push({id:s.id, name:s.name}); } });
    const o = {n:u.n, name:u.name.slice(0,120), subs}; if(u.off) o.off = true; if(!d) o.custom = true; out.units.push(o);
  });
  def.units.forEach(d=>{ if(!seenU.has(d.n)) out.units.push(d); });
  out.units.sort((a,b)=>a.n-b.n);
  return out;
}
let SUBIX = {};
function indexSyl(){ SUBIX = {}; S.syl.units.forEach(u=>u.subs.forEach(s=>{ SUBIX[s.id] = {u:u.n, s}; })); }
const unitOf = n => S.syl.units.find(u=>u.n===n);
const activeUnits = () => S.syl.units.filter(u=>!u.off);
const activeSubs = u => u ? u.subs.filter(s=>!s.off) : [];
const uname = n => (unitOf(n)||{}).name || ("Topic "+n);
const subName = id => (SUBIX[id] && SUBIX[id].s.name) || "";
function isActiveQ(q){ const u = unitOf(q.u); if(!u || u.off) return false; const x = SUBIX[q.s]; return !x || !x.s.off; }
function legacySub(u, t){
  const unit = unitOf(u); if(!unit) return "";
  const byName = unit.subs.find(s=>s.name.toLowerCase() === String(t||"").toLowerCase());
  if(byName) return byName.id;
  if(LEGACY[u+"|"+t]) return LEGACY[u+"|"+t];
  return unit.subs[0] ? unit.subs[0].id : "";
}
/* A topic with no sub-topics gets a "General" one, so every question has a home. */
function ensureGeneralSub(n){
  const u = unitOf(n); if(!u || activeSubs(u).length) return false;
  const off = u.subs.find(s=>s.name.toLowerCase()==="general");
  if(off) delete off.off; else u.subs.push({id:"c"+rid(), name:"General", custom:true});
  indexSyl(); return true;
}

function packMat(m){ return {id:m.id,name:m.name,u:m.u,subs:m.subs,at:m.at,pages:m.pages,status:m.status,note:m.note,how:m.how,pw:m.pw,qs:m.qs.map(packQ)}; }
function applyState(d){
  const before = JSON.stringify([S.completed, S.syl]);
  S = {completed: clone(d.completed), attempts: clone(d.attempts), flags: Array.isArray(d.flags) ? clone(d.flags) : [], syl: d.syl ? normSyl(d.syl) : S.syl};
  indexSyl();
  S.completed = [...new Set(S.completed)].filter(n=>{ if(!Number.isInteger(n)) return false; const u = unitOf(n); return u && !u.off; }).sort((a,b)=>a-b);
  if(JSON.stringify([S.completed, S.syl]) !== before) P.sel = null;
  rebuildBank();
}
function hasData(){ return S.completed.length > 0 || S.attempts.length > 0; }
function seedOwner(){ applyState({completed:[1,3,4], attempts:[clone(SEED_ATTEMPT)], flags:[]}); }
function live(){ if(LVV === VER) return LVC; const f = new Set(S.flags); LVC = BANK.filter(q=>!f.has(q.id) && isActiveQ(q)); LVV = VER; return LVC; }

function readLS(key){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }

/* ---------- SAVING ----------
   The shared record (db) is the source of truth. Each finished test, each flag and each batch of
   Claude-written questions is its own document, so two phones never overwrite each other's work.
   Anything the server has not confirmed yet waits in an outbox on this phone and is sent again
   when the connection comes back. The browser copy is only a cache for a quick start. */
let stateRef = null, sessRef = null, flagRef = null, genRef = null, qbankRef = null, matRef = null;
let cloudBlocked = false, syncErr = false, seeded = false, lastMain = "", mainLegacy = false;
let OUT = {s:{}, f:{}, g:{}};            /* pending: session id → body (null = delete), question id → flagged?, batch id → body (null = delete) */
const CL = {s:{}, f:{}, g:{}, ls:{}, lf:[], lg:null, ready:{m:false, s:false, f:false, g:false, gl:false}, mainExists:false};
const matSeen = {}, matChains = {}, matRetry = new Set(), sending = new Set(), WQ = [];
let wRunning = 0;
const cloudOn = () => !!stateRef && !cloudBlocked;
const outCount = () => Object.keys(OUT.s).length + Object.keys(OUT.f).length + Object.keys(OUT.g).length + matRetry.size + (GUEST && needMark && !gMarked ? 1 : 0);
const ownG = () => GU[ME.id] || {s:{}, f:{}};
const mineS = () => GUEST ? ownG().s : CL.s;
const mineF = () => GUEST ? ownG().f : CL.f;
const guestHas = q => Object.keys(GU).some(g=>GU[g].f[q]);
const othersFlag = q => !!CL.f[q] || CL.lf.includes(q) || Object.keys(GU).some(g=>g !== ME.id && GU[g].f[q]);
const ownFlag = q => GUEST ? (!!ownG().f[q] || OUT.f[q] === true) : true;
function ownColl(k){ return DB.collection("guests/"+ME.id+"/"+k); }
function watchGuest(gid){
  if(GU[gid] || typeof gid !== "string" || !/^[A-Za-z0-9_.~:@+-]{1,150}$/.test(gid)) return;
  const g = GU[gid] = {s:{}, f:{}, rs:false, rf:false, un:[]};
  try{
    g.un.push(DB.collection("guests/"+gid+"/s").onSnapshot(snap=>{
      g.s = {}; snap.docs.forEach(doc=>{ const d = doc.data(); if(d && Array.isArray(d.a) && typeof d.t === "number") g.s[doc.id] = sBody(d); });
      g.rs = true; settle(); derive(); renderAll();
    }, ()=>{}));
    g.un.push(DB.collection("guests/"+gid+"/f").onSnapshot(snap=>{
      g.f = {}; snap.docs.forEach(doc=>{ g.f[doc.id] = true; });
      g.rf = true; settle(); derive(); renderAll();
    }, ()=>{}));
  }catch(e){}
}
/* Drop outbox entries the server has confirmed. */
function settle(){
  if(GUEST){
    const g = GU[ME.id]; if(!g) return;
    if(g.rs) Object.keys(OUT.s).forEach(id=>{ if(OUT.s[id] ? g.s[id] : !g.s[id]) delete OUT.s[id]; });
    if(g.rf) Object.keys(OUT.f).forEach(q=>{ if(!!g.f[q] === OUT.f[q]) delete OUT.f[q]; });
    if(CL.ready.gl && !gMarked && (Object.keys(g.s).length || Object.keys(g.f).length) && cloudOn()){ needMark = true; pushOut(); }
    return;
  }
  if(CL.ready.s) Object.keys(OUT.s).forEach(id=>{ if(OUT.s[id] ? CL.s[id] : !CL.s[id]) delete OUT.s[id]; });
  if(CL.ready.f) Object.keys(OUT.f).forEach(q=>{ const has = OUT.f[q] ? !!CL.f[q] : !!(CL.f[q] || guestHas(q)); if(has === OUT.f[q] && !CL.lf.includes(q)) delete OUT.f[q]; });
}

function loadLocal(key){
  let d = readLS(key);
  if(!validState(d) && key === LS_BASE+":anon") d = readLS(LS_OLD);
  const o = readLS(key+":out");
  if(o && typeof o === "object") OUT = {s:o.s || {}, f:o.f || {}, g:o.g || {}};
  if(validState(d)){
    applyState(d); setGen(d.gen);
    const mats = readLS(key+":mats") || d.mats;
    M = (Array.isArray(mats) ? mats : []).map(normMat).filter(Boolean); rebuildBank();
    return true;
  }
  return false;
}
function persistLocal(){
  try{ localStorage.setItem(lsKey, JSON.stringify({completed:S.completed, attempts:S.attempts, flags:S.flags, syl:S.syl, gen:GEN})); }catch(e){}
  try{ localStorage.setItem(lsKey+":out", JSON.stringify(OUT)); }catch(e){}
}
function persistMats(){
  try{ localStorage.setItem(lsKey+":mats", JSON.stringify(M.map(packMat))); }catch(e){ try{ localStorage.removeItem(lsKey+":mats"); }catch(_){} }
}
function setSync(){
  const el = $("#sync"); if(!el) return;
  const n = outCount();
  let s = "cloud", txt = "Saved to the shared record";
  if(!stateRef){ s = "local"; txt = "Saved on this device only"; }
  else if(cloudBlocked){ s = "local"; txt = "View-only access, saved on this device only"; }
  else if(n && syncErr){ s = "error"; txt = plural(n, "change")+" waiting to upload, will retry"; }
  else if(n || wRunning){ s = "local"; txt = "Saving…"; }
  el.dataset.s = s; el.lastElementChild.textContent = txt;
}
function onWriteErr(e){
  const c = e && e.code;
  if(c === "invalid_argument" || c === "not_granted" || c === "revoked"){ cloudBlocked = true; renderAll(); }
  else { syncErr = true; if(c === "quota_exceeded") toast("Online storage is full. Delete a material you no longer need."); }
  setSync();
}
/* A few writes at a time; each one is retried later if it fails. */
function send(key, write, done){
  if(sending.has(key)) return;
  sending.add(key); WQ.push({key, write, done}); pump();
}
function pump(){
  while(wRunning < 4 && WQ.length){
    const t = WQ.shift(); wRunning++;
    Promise.resolve().then(t.write).then(()=>{ syncErr = false; t.done(); persistLocal(); }, onWriteErr)
      .finally(()=>{ wRunning--; sending.delete(t.key); afterWrites(); setSync(); pump(); });
  }
}
function afterWrites(){
  /* once the old one-record layout has been copied into separate documents, slim the record down */
  if(mainLegacy && cloudOn() && !GUEST && !wRunning && !WQ.length && !Object.keys(OUT.s).length && !Object.keys(OUT.f).length){ mainLegacy = false; writeMain(true); }
}
function pushOut(){
  if(!cloudOn()){ setSync(); return; }
  if(GUEST && !gMarked && (needMark || Object.keys(OUT.s).length || Object.keys(OUT.f).length)){
    needMark = true;
    send("gmark", ()=>DB.doc("guests/"+ME.id).set({at:Date.now()}), ()=>{ needMark = false; gMarked = true; });
  }
  Object.keys(OUT.s).forEach(id=>{ const body = OUT.s[id], ref = GUEST ? ownColl("s") : sessRef;
    send("s"+id, ()=> body ? ref.doc(id).set(sBody(body)) : ref.doc(id).delete(),
      ()=>{ if(OUT.s[id] !== body) return; delete OUT.s[id]; const ms = mineS(); if(body) ms[id] = body; else delete ms[id]; }); });
  Object.keys(OUT.f).forEach(q=>{ const on = OUT.f[q];
    const w = GUEST
      ? ()=> on ? ownColl("f").doc(q).set({q, at:Date.now()}) : ownColl("f").doc(q).delete()
      /* the owner's "restore" also clears copies of that flag in guests' folders */
      : ()=> on ? flagRef.doc(q).set({q, at:Date.now()}) : Promise.all([flagRef.doc(q).delete()].concat(Object.keys(GU).filter(g=>GU[g].f[q]).map(g=>DB.doc("guests/"+g+"/f/"+q).delete())));
    send("f"+q, w,
      ()=>{ if(OUT.f[q] !== on) return; delete OUT.f[q]; const mf = mineF(); if(on) mf[q] = true; else { delete mf[q]; if(!GUEST) Object.keys(GU).forEach(g=>{ delete GU[g].f[q]; }); } }); });
  Object.keys(OUT.g).forEach(id=>{ const body = OUT.g[id];
    send("g"+id, ()=> body ? genRef.doc(id).set(body) : genRef.doc(id).delete(),
      ()=>{ if(OUT.g[id] !== body) return; delete OUT.g[id]; if(body) CL.g[id] = body; else delete CL.g[id];
            if(id === "legacy" && qbankRef) qbankRef.delete().catch(()=>{}); }); });
  [...matRetry].forEach(mid=>{ matRetry.delete(mid); const m = MBY[mid]; if(m) saveMat(m); });
  [...matDel].forEach(mid=>dropMatDocs(mid));
  setSync();
}
function writeMain(force){
  if(!cloudOn()) return;
  const body = {v:3, completed:S.completed.slice(), syl:clone(S.syl)};
  const js = JSON.stringify(body);
  if(!force && js === lastMain) return;
  lastMain = js;
  send("main"+Date.now(), ()=>stateRef.set(Object.assign(body, {updatedAt:Date.now()})), ()=>{});
}
/* topics completed and the syllabus */
function save(){ dirty(); persistLocal(); writeMain(false); }
function addSession(at){
  S.attempts.push(at);
  if(stateRef) OUT.s[at.id] = at;
  dirty(); persistLocal(); pushOut();
}
function setFlags(ids, on){
  if(!on && GUEST) ids = ids.filter(ownFlag);
  ids.forEach(q=>{
    if(on){ if(!S.flags.includes(q)) S.flags.push(q); } else S.flags = S.flags.filter(x=>x !== q);
    if(stateRef) OUT.f[q] = on;
  });
  dirty(); persistLocal(); pushOut();
}
function addGen(items){
  const id = "b"+rid();
  GEN = GEN.concat(items); rebuildBank();
  if(stateRef) OUT.g[id] = {at:Date.now(), items:items.map(q=>({id:q.id,u:q.u,s:q.s,q:q.q,o:q.o,a:q.a,w:q.w,r:q.r}))};
  persistLocal(); pushOut();
}
function genTooBig(items){ return JSON.stringify(items).length > 200000; }
/* Rebuild tests, flags and Claude-written questions from the server's copy plus this phone's outbox. */
function derive(){
  if(!stateRef) return;
  if(CL.ready.s){
    const gs = {}; Object.keys(GU).forEach(g=>Object.assign(gs, GU[g].s));
    const all = Object.assign({}, CL.ls, gs, CL.s, OUT.s);
    S.attempts = Object.keys(all).filter(id=>all[id]).map(id=>Object.assign({}, all[id], {id})).sort((a,b)=>a.t-b.t);
  }
  if(CL.ready.f){
    const f = new Set(CL.lf.concat(Object.keys(CL.f)));
    Object.keys(GU).forEach(g=>Object.keys(GU[g].f).forEach(q=>f.add(q)));
    Object.keys(OUT.f).forEach(q=>{ if(OUT.f[q]) f.add(q); else if(!GUEST || !othersFlag(q)) f.delete(q); });
    S.flags = [...f];
  }
  if(CL.ready.g){
    const all = Object.assign({}, CL.lg ? {legacy:{at:0, items:CL.lg}} : {}, CL.g, OUT.g), seen = new Set(), items = [];
    Object.keys(all).filter(id=>all[id]).map(id=>all[id]).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(b=>(b.items || []).forEach(q=>{ if(q && !seen.has(q.id)){ seen.add(q.id); items.push(q); } }));
    setGen(items);
  } else rebuildBank();
  persistLocal();
}
function applyMain(d){
  const before = JSON.stringify([S.completed, S.syl]);
  if(d.syl) S.syl = normSyl(d.syl);
  indexSyl();
  S.completed = [...new Set(d.completed)].filter(n=>{ if(!Number.isInteger(n)) return false; const u = unitOf(n); return u && !u.off; }).sort((a,b)=>a-b);
  if(JSON.stringify([S.completed, S.syl]) !== before){ P.sel = null; rebuildBank(); persistLocal(); }
}
function maybeSeed(){
  if(seeded || !CL.ready.m || !CL.ready.s) return;
  seeded = true;
  if(CL.mainExists || Object.keys(CL.s).length || Object.keys(OUT.s).length){ if(!CL.mainExists && S.completed.length) writeMain(true); return; }
  if(!ME.owner || !cloudOn()) return;
  S.completed = [1,3,4]; P.sel = null; writeMain(true);
  addSession(clone(SEED_ATTEMPT));
}

/* Each material is stored as one or more documents of up to ~180 KB: materials/<id>_<part>. */
const MAT_PART_MAX = 180000;
const matDel = new Set();
function matDocs(m){
  const meta = {mid:m.id, name:m.name, u:m.u, subs:m.subs || null, at:m.at, pages:m.pages || "", status:m.status, note:m.note || "", how:m.how || "", pw:m.pw || ""};
  const parts = []; let cur = [], size = 0;
  m.qs.forEach(q=>{ const p = packQ(q), j = JSON.stringify(p).length; if(cur.length && size + j > MAT_PART_MAX){ parts.push(cur); cur = []; size = 0; } cur.push(p); size += j; });
  parts.push(cur);
  return parts.map((qs, i)=>({id:m.id+"_"+i, body:Object.assign({}, meta, {part:i, parts:parts.length, qs})}));
}
function chainWrite(id, onFail, fn){
  matChains[id] = (matChains[id] || Promise.resolve()).then(fn).then(()=>{ syncErr = false; setSync(); })
    .catch(e=>{ delete matSeen[id]; onFail(); onWriteErr(e); });
}
function saveMat(m){
  persistMats();
  if(!cloudOn() || GUEST){ return; }
  const docs = matDocs(m), keep = new Set(docs.map(d=>d.id));
  docs.forEach(d=>{ const js = JSON.stringify(d.body); if(matSeen[d.id] === js) return; matSeen[d.id] = js; chainWrite(d.id, ()=>matRetry.add(m.id), ()=>matRef.doc(d.id).set(d.body)); });
  Object.keys(matSeen).forEach(id=>{ if(id.slice(0, id.lastIndexOf("_")) === m.id && !keep.has(id)){ delete matSeen[id]; chainWrite(id, ()=>matRetry.add(m.id), ()=>matRef.doc(id).delete()); } });
}
function dropMatDocs(mid){
  persistMats();
  if(!cloudOn() || GUEST) return;
  matDel.delete(mid);
  Object.keys(matSeen).forEach(id=>{ if(id.slice(0, id.lastIndexOf("_")) === mid){ delete matSeen[id]; chainWrite(id, ()=>matDel.add(mid), ()=>matRef.doc(id).delete()); } });
}

async function connect(){
  let user = null, db = null;
  try{
    if(window.claude && window.claude.use){
      try{ user = await window.claude.use("user"); }catch(e){}
      try{ db = await window.claude.use("db"); }catch(e){}
      try{ SAMPLE = await window.claude.use("sample"); }catch(e){}
      if(SAMPLE){ try{ const l = await SAMPLE.limits(); IMGLIM = (l && l.images) || null; }catch(e){ IMGLIM = null; } }
      if(user){
        try{ ME.id = await user.id(); }catch(e){}
        try{ ME.owner = !!(await user.isOwner()); }catch(e){}
        try{ if(db && (await user.can("data.write")) === false) cloudBlocked = true; }catch(e){}
        GUEST = !!db && !ME.owner;
        if(GUEST && !(typeof ME.id === "string" && /^[A-Za-z0-9_.~:@+-]{1,150}$/.test(ME.id))) cloudBlocked = true;
      }
    }
  }catch(e){}
  READY = true;
  if(ME.id){
    const hadAnon = hasData() || M.length > 0, prevOut = OUT;
    lsKey = LS_BASE + ":" + ME.id;
    const had = loadLocal(lsKey);
    OUT = {s:Object.assign({}, prevOut.s, OUT.s), f:Object.assign({}, prevOut.f, OUT.f), g:Object.assign({}, prevOut.g, OUT.g)};
    if(!had && hadAnon){ persistLocal(); persistMats(); }
  }
  if(!db){
    if(!hasData() && (ME.owner || !window.claude)){ seedOwner(); persistLocal(); }
    setSync(); renderAll(); return;
  }
  stateRef = db.doc("progress/main");
  sessRef = db.collection("sessions");
  flagRef = db.collection("flags");
  genRef = db.collection("gen");
  qbankRef = db.doc("progress/qbank");
  matRef = db.collection("materials");
  DB = db;
  if(GUEST && ME.id) watchGuest(ME.id);
  db.collection("guests").onSnapshot(snap=>{
    const ids = new Set(snap.docs.map(d=>d.id));
    ids.forEach(watchGuest);
    Object.keys(GU).forEach(g=>{ if(!ids.has(g) && g !== ME.id){ GU[g].un.forEach(u=>{ try{ u(); }catch(e){} }); delete GU[g]; } });
    if(GUEST && ids.has(ME.id)){ gMarked = true; needMark = false; }
    CL.ready.gl = true; settle(); derive(); renderAll();
  }, ()=>{});
  setSync();
  stateRef.onSnapshot(snap=>{
    CL.ready.m = true; CL.mainExists = snap.exists;
    const d = snap.exists ? (snap.data() || {}) : {};
    /* the first layout kept every test and flag inside this one record */
    CL.ls = {}; (Array.isArray(d.attempts) ? d.attempts : []).forEach(a=>{ if(a && typeof a.id === "string" && Array.isArray(a.a) && typeof a.t === "number" && /^[A-Za-z0-9_.~:@+-]{1,150}$/.test(a.id)) CL.ls[a.id] = {t:a.t, a:a.a}; });
    CL.lf = Array.isArray(d.flags) ? d.flags.filter(q=>typeof q === "string" && /^[A-Za-z0-9_.~:@+-]{1,150}$/.test(q)) : [];
    if((Object.keys(CL.ls).length || CL.lf.length || Array.isArray(d.attempts)) && cloudOn() && !GUEST){
      Object.keys(CL.ls).forEach(id=>{ if(!(id in OUT.s)) OUT.s[id] = CL.ls[id]; });
      CL.lf.forEach(q=>{ if(!(q in OUT.f)) OUT.f[q] = true; });
      mainLegacy = true; pushOut(); afterWrites();
    }
    if(snap.exists && Array.isArray(d.completed)){
      applyMain(d);
      lastMain = JSON.stringify({v:3, completed:S.completed.slice(), syl:clone(S.syl)});
      if(!d.syl) writeMain(true);
    }
    derive(); maybeSeed(); renderAll();
  }, ()=>{ setSync(); });
  sessRef.onSnapshot(snap=>{
    CL.s = {};
    snap.docs.forEach(doc=>{ const d = doc.data(); if(d && Array.isArray(d.a) && typeof d.t === "number") CL.s[doc.id] = sBody(d); });
    CL.ready.s = true; settle(); derive(); maybeSeed(); renderAll();
  }, ()=>{});
  flagRef.onSnapshot(snap=>{
    CL.f = {}; snap.docs.forEach(doc=>{ CL.f[doc.id] = true; });
    CL.ready.f = true; settle(); derive(); renderAll();
  }, ()=>{});
  genRef.onSnapshot(snap=>{
    CL.g = {}; snap.docs.forEach(doc=>{ const d = doc.data(); if(d && Array.isArray(d.items)) CL.g[doc.id] = {at:d.at || 0, items:d.items}; });
    Object.keys(OUT.g).forEach(id=>{ if(OUT.g[id] ? CL.g[id] : !CL.g[id]) delete OUT.g[id]; });
    CL.ready.g = true; derive(); renderAll();
  }, ()=>{});
  qbankRef.onSnapshot(snap=>{
    const d = snap.exists ? snap.data() : null;
    CL.lg = d && Array.isArray(d.items) && d.items.length ? d.items : null;
    if(CL.lg && cloudOn() && !GUEST && !CL.g.legacy && !("legacy" in OUT.g)){ OUT.g.legacy = {at:0, items:CL.lg}; pushOut(); }
    if(CL.ready.g){ derive(); renderAll(); }
  }, ()=>{});
  let firstMat = true;
  matRef.onSnapshot(snap=>{
    const groups = {};
    snap.docs.forEach(doc=>{ const d = doc.data(); if(!d || typeof d.mid !== "string") return; matSeen[doc.id] = JSON.stringify(d); (groups[d.mid] || (groups[d.mid] = [])).push(d); });
    const next = [];
    Object.keys(groups).forEach(mid=>{
      if(JOB && JOB.mat && JOB.mat.id === mid){ next.push(JOB.mat); return; }
      const ps = groups[mid].sort((a,b)=>(a.part||0)-(b.part||0)), h = ps[0];
      const m = normMat({id:mid, name:h.name, u:h.u, subs:h.subs, at:h.at, pages:h.pages, status:h.status, note:h.note, how:h.how, pw:h.pw, qs:[].concat(...ps.map(p=>Array.isArray(p.qs) ? p.qs : []))});
      if(m) next.push(m);
    });
    M.forEach(m=>{
      if(groups[m.id]) return;
      const active = JOB && JOB.mat && JOB.mat.id === m.id;
      if(active || cloudBlocked || matRetry.has(m.id)){ next.push(m); return; }
      if(firstMat && !GUEST){ next.push(m); saveMat(m); }   /* made on this phone before the shared record was reachable */
    });
    firstMat = false;
    M = next.sort((a,b)=>a.at-b.at);
    rebuildBank(); persistMats(); renderAll();
  }, ()=>{});
  window.addEventListener("online", ()=>{ syncErr = false; pushOut(); });
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && outCount()) pushOut(); });
  pushOut();
  renderAll();
}

/* ---------- STATS ---------- */
function stats(){
  if(STV === VER && STC) return STC;
  const per = {}, sessions = [], flagged = new Set(S.flags);
  const attempts = S.attempts.slice().sort((a,b)=>a.t-b.t);
  attempts.forEach((at, idx)=>{
    let right = 0, total = 0; const byUnit = {};
    at.a.forEach(pair=>{
      const qid = pair[0], pick = pair[1], q = BY[qid];
      if(!q || flagged.has(qid) || !isActiveQ(q)) return;
      const ok = pick === q.a; total++; if(ok) right++;
      const p = per[qid] || (per[qid] = {n:0,right:0,last:null,lastT:0,lastPick:null});
      p.n++; if(ok) p.right++; p.last = ok; p.lastT = at.t; p.lastPick = pick;
      const u = byUnit[q.u] || (byUnit[q.u] = {r:0,n:0}); u.n++; if(ok) u.r++;
    });
    sessions.push({idx: idx+1, at, right, total, byUnit});
  });
  const unit = {}, topic = {};
  Object.keys(per).forEach(id=>{
    const q = BY[id], p = per[id];
    const u = unit[q.u] || (unit[q.u] = {n:0,r:0,seen:0});
    u.n += p.n; u.r += p.right; u.seen++;
    const k = q.u + "|" + q.s;
    const t = topic[k] || (topic[k] = {u:q.u, s:q.s, n:0, r:0});
    t.n += p.n; t.r += p.right;
  });
  const missed = Object.keys(per).filter(id=>per[id].last===false).sort((a,b)=>per[b].lastT-per[a].lastT);
  let right = 0, total = 0; sessions.forEach(s=>{ right += s.right; total += s.total; });
  const days = new Set(attempts.map(a=>dkey(a.t)));
  let streak = 0; const d = new Date();
  if(!days.has(dkey(d.getTime()))) d.setDate(d.getDate()-1);
  while(days.has(dkey(d.getTime()))){ streak++; d.setDate(d.getDate()-1); }
  STC = {per, sessions, unit, topic, missed, right, total, streak, days}; STV = VER;
  return STC;
}

  return {cls:"bad", label:"Revise"};
}

function inScope(q){ const s = P.sel && P.sel.get(q.u); return !!s && s.has(q.s); }

/* Interleave sub-topics so one sub-topic does not fill the whole set. */
function spread(list){
  const by = new Map(); list.forEach(q=>{ if(!by.has(q.s)) by.set(q.s, []); by.get(q.s).push(q); });
  const lanes = shuffle([...by.values()]), out = [];
  for(let i=0; out.length < list.length; i++) lanes.forEach(l=>{ if(i < l.length) out.push(l[i]); });
  return out;
}
function buildSession(){
  const st = stats(), per = st.per, used = new Set();
  const fresh = q => !per[q.id] ? 0 : (per[q.id].last===false ? 1 : 2);
  let items = [];
  selUnits().forEach(u=>{
    const pool = scopePool(u), chosen = [];
    const take = q => {
      if(chosen.length >= P.per || chosen.includes(q)) return false;
      const k = pkey(q); if(k && used.has(k)) return false;
      chosen.push(q); if(k) used.add(k); return true;
    };
    const unseen = shuffle(pool.filter(q=>fresh(q)===0));
    const missed = shuffle(pool.filter(q=>fresh(q)===1));
    const seen = pool.filter(q=>fresh(q)===2).sort((a,b)=>per[a.id].lastT-per[b.id].lastT);
    if(P.order==="missed") spread(missed).forEach(take);
    else if(P.order==="random") shuffle(pool).forEach(take);
    else if(P.order==="priority"){
      /* materials, then previous-year, then the rest; new before missed within each, repeats last */
      [0,1,2].forEach(t=>{ spread(unseen.filter(q=>tierOf(q)===t)).forEach(take); spread(missed.filter(q=>tierOf(q)===t)).forEach(take); });
      [0,1,2].forEach(t=>seen.filter(q=>tierOf(q)===t).forEach(take));
    } else {
      missed.slice(0, Math.min(2, Math.ceil(P.per/4))).forEach(take);
      if(P.src==="all"){ const cap = Math.ceil(P.per/3); let c = 0; unseen.filter(isPyq).concat(seen.filter(isPyq)).forEach(q=>{ if(c < cap && take(q)) c++; }); }
      spread(unseen).concat(missed, seen).forEach(take);
    }
    items = items.concat(shuffle(chosen));
  });
  return items.map(q=>({q, perm: shuffle(q.o.map((_,k)=>k))}));
}

  const items = buildSession(); let n = 0;

  return n;
}

function parseJsonArray(text){
  const a = text.indexOf("["), b = text.lastIndexOf("]");
  if(a < 0 || b <= a) return [];
  try{ const v = JSON.parse(text.slice(a, b+1)); return Array.isArray(v) ? v : []; }catch(e){ return []; }
}
function cleanOpts(x){
  if(!x || typeof x.q!=="string" || !Array.isArray(x.o) || x.o.length!==4) return null;
  const o = x.o.map(s=>String(s==null ? "" : s).trim());
  if(o.some(s=>!s || s.length > 300)) return null;
  if(new Set(o.map(s=>s.toLowerCase())).size !== 4) return null;
  const a = Number(x.a); if(!Number.isInteger(a) || a<0 || a>3) return null;
  const q = x.q.trim(), w = String(x.w||"").trim(), r = String(x.r||"").trim();
  if(!q || !w || !r || q.length > 900 || w.length > 900 || r.length > 500) return null;
  return {q, o, a, w, r};
}
function cleanGen(arr, unitN, codes){
  const seen = new Set(live().map(q=>normQ(q.q)));
  const out = [];
  arr.forEach((x, i)=>{
    const c = cleanOpts(x); if(!c) return;
    const nq = normQ(c.q); if(seen.has(nq)) return; seen.add(nq);
    const hit = codes.find(k=>k.c === String(x.s||"").trim());
    out.push(Object.assign({id:"g"+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5), u:unitN, s:(hit || codes[0]).id}, c, {gen:true}));
  });
  return out;
}
